/* ===== js/core/coach.js ===== */
/* Coach: die regelbasierte Lernlogik hinter Capy.
   Erkennt Stärken und Lücken, schlägt Trainingsmissionen vor, entscheidet über Edelsteine.
   Alles nachvollziehbar, ohne KI, direkt im Browser. */
window.Coach = (function () {
  const MIN_TRIES = 5;

  function stat(id) {
    const s = Store.state.skills[id];
    if (!s || !s.hist || !s.hist.length) return { tries: 0, rate: null, recent: null, level: s ? s.level : 1 };
    const recent = s.hist.slice(-10);
    return {
      tries: s.tries, level: s.level,
      rate: s.first / Math.max(1, s.tries),
      recent: recent.reduce((a, b) => a + b, 0) / recent.length,
      errors: s.errors, goodDays: (s.goodDays || []).length
    };
  }
  const isGem = id => Store.state.gems.includes(id);

  // Stärken: Edelsteine oder sicher gelöst
  function strengths() {
    return SKILLS.filter(sk => { const s = stat(sk.id); return isGem(sk.id) || (s.tries >= MIN_TRIES && s.recent >= .8); });
  }
  // Lücken: oft geübt, aber noch unsicher. Mit häufigstem Fehlertyp.
  function gaps() {
    const out = [];
    SKILLS.forEach(sk => {
      const s = stat(sk.id), raw = Store.state.skills[sk.id];
      if (s.tries < MIN_TRIES || s.recent >= .65) return;
      const log = (raw.errLog || []).slice(-12);
      const count = {}; log.forEach(c => (count[c] = (count[c] || 0) + 1));
      const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
      out.push({ skill: sk, rate: s.recent, code: top ? top[0] : 'sonst' });
    });
    return out.sort((a, b) => a.rate - b.rate);
  }
  // Trainingsmission: Grundlagen zur Lücke + Stärken (Sandwich 70/30)
  function training() {
    const g = gaps()[0];
    if (!g) return null;
    const err = X.ERR[g.code] || X.ERR.sonst;
    let base = err.train.map(X.byId).filter(Boolean);
    // Grundlagen nur, wenn sie nicht schwerer sind als die Lücke selbst
    if (!base.length) base = [g.skill];
    const focus = U.uniq([...base.map(b => b.id), g.skill.id]);
    const strong = strengths().filter(s => !focus.includes(s.id)).map(s => s.id);
    return { gap: g, focus, strong, mission: err.mission };
  }

  // Welche Welt passt gerade?
  function worldReady(world) {
    const ids = SKILLS.filter(s => s.world === world).map(s => s.id);
    const good = ids.filter(id => isGem(id) || (stat(id).tries >= MIN_TRIES && stat(id).recent >= .8));
    return { total: ids.length, good: good.length, gems: ids.filter(isGem).length };
  }
  function suggestWorld() {
    const w1 = worldReady('w1'), w2 = worldReady('w2');
    const core1 = ['freunde', 'plus20', 'minus20'].every(id => isGem(id) || (stat(id).tries >= MIN_TRIES && stat(id).recent >= .8));
    if (!core1) return { world: 'w1', why: 'Zehnerfreunde und Rechnen über die 10 sind noch nicht ganz sicher. Das ist die wichtigste Grundlage für alles Weitere.' };
    const core2 = ['buendeln', 'analogie', 'ergaenzen'].every(id => isGem(id) || (stat(id).tries >= MIN_TRIES && stat(id).recent >= .8));
    if (!core2) return { world: 'w2', why: `Klasse-1-Kern ist sicher (${w1.good} von ${w1.total} Themen). Jetzt lohnt sich die Brücke: Bündeln, Analogien, Ergänzen zum Zehner.` };
    return { world: 'w3', why: `Auch die Brücke sitzt (${w2.good} von ${w2.total}). Bereit für den Stoff der 2. Klasse.` };
  }

  // Mission des Tages: Förderbedarf vor Neuem, sonst nächstes ungeübtes Thema der aktuellen Welt
  function missionOfDay() {
    const tr = training();
    if (tr) return { type: 'training', ...tr, title: 'Trainingsmission', text: U.t(U.pick(PHRASES.missionAsk), { mission: tr.mission }) };
    const w = Store.state.recommended || 'w1';
    const list = SKILLS.filter(s => s.world === w);
    const next = list.find(s => !isGem(s.id) && stat(s.id).tries < 12) || list.find(s => !isGem(s.id)) || U.pick(list);
    return { type: 'skill', skill: next, title: next.title, text: `Heute erforschen wir: ${next.title}. ${next.desc}.` };
  }

  // Nach einer Einheit: guter Tag? Edelstein verdient?
  function afterSession(skillIds, results) {
    const st = Store.state, news = [];
    skillIds.forEach(id => {
      const r = results[id]; if (!r || r.n < 3) return;
      const s = Store.skill(id);
      const wasGap = gaps().some(g => g.skill.id === id);
      if (r.first / r.n >= .8) { s.goodDays = U.uniq([...(s.goodDays || []), U.today()]).slice(-10); }
      const recent = (s.hist || []).slice(-8);
      const ok = recent.length >= 6 && recent.filter(Boolean).length >= 6 && (s.goodDays || []).length >= 2;
      if (ok && !st.gems.includes(id)) { st.gems.push(id); news.push({ id, closedGap: wasGap || (s.wasGap === true) }); }
      if (wasGap) s.wasGap = true;
    });
    Store.save();
    return news;
  }

  // Stärke, an die Capy zu Beginn erinnert
  function strengthLine() {
    const s = strengths();
    if (!s.length) return null;
    const sk = U.pick(s);
    return `Du bist schon richtig gut bei „${sk.title}“. Das hilft uns heute!`;
  }

  // Wochenbrief-Inhalt
  function weekSummary() {
    const st = Store.state, since = Date.now() - 7 * 864e5;
    const sess = st.sessions.filter(s => new Date(s.date).getTime() >= since);
    const solved = sess.reduce((a, s) => a + s.solved, 0), stars = sess.reduce((a, s) => a + (s.stars || 0), 0);
    const newGems = st.gems.filter(id => sess.some(s => (s.newGems || []).includes(id))).map(id => X.byId(id).gem);
    const m = missionOfDay();
    const p = [];
    p.push(sess.length ? `diese Woche hast du ${sess.length} Reportage${sess.length > 1 ? 'n' : ''} mit mir gemacht und ${solved} Aufgaben gelöst. Wow!` : 'diese Woche haben wir uns noch nicht so oft gesehen. Ich freu mich schon auf dich!');
    if (stars) p.push(`Du hast ${stars} Mutmach-Sterne gesammelt. Die gibt es fürs Dranbleiben, auch wenn es knifflig war. Darauf bin ich besonders stolz.`);
    if (newGems.length) p.push(`Neu in deiner Schatzkiste: ${newGems.join(', ')}. 💎`);
    else { const s = strengths()[0]; if (s) p.push(`Besonders gut kannst du schon: ${s.title}.`); }
    p.push(`Als Nächstes wartet: ${m.title}. ${m.type === 'training' ? 'Da brauche ich deine Hilfe!' : 'Das wird ein Abenteuer!'}`);
    p.push(U.pick(PHRASES.capyStory));
    return p;
  }

  return { stat, strengths, gaps, training, worldReady, suggestWorld, missionOfDay, afterSession, strengthLine, weekSummary, isGem };
})();

/* ===== js/core/engine.js ===== */
/* Engine: führt eine Lerneinheit durch.
   Gestufte Hilfe (Hinweis → Hilfe-Bild → gemeinsam rechnen + leichtere Aufgabe),
   Fehleranalyse, Anpassung der Stufe, Frust-Erkennung, garantierter Erfolg am Ende. */
window.Engine = (function () {
  const { h, wait } = U;
  let S = null; // laufende Sitzung

  /* ---------- Start ---------- */
  function start(opt) {
    const queue = [];
    if (opt.training) {
      const tr = opt.training;
      const pattern = ['s', 'g', 's', 's', 'g', 's', 'g', 's'];
      let gi = 0;
      pattern.forEach(p => {
        if (p === 'g' || !tr.strong.length) {
          const id = tr.focus[gi++ % tr.focus.length];
          queue.push({ id, lvl: Math.max(1, Store.skill(id).level - (p === 'g' ? 0 : 1)) });
        } else queue.push({ id: U.pick(tr.strong), lvl: null });
      });
    } else {
      const n = opt.count || 7;
      for (let i = 0; i < n; i++) queue.push({ id: opt.skills[i % opt.skills.length], lvl: null });
    }
    S = {
      opt, queue, idx: 0, results: {}, stars: 0, coins: 0, hardRow: 0, fastWrong: 0, pauses: 0,
      world: opt.world || X.byId(queue[0].id).world, training: !!opt.training
    };
    document.body.classList.add('in-session');
    ritual(() => next());
  }

  /* Startritual: Capy-Atmung */
  function ritual(go) {
    const ov = document.getElementById('overlay');
    const line = Coach.strengthLine();
    const skip = () => { ov.hidden = true; ov.innerHTML = ''; go(); };
    ov.innerHTML = '';
    ov.appendChild(h('div.modal', {}, [
      h('h2', { text: 'Capy-Atmung' }),
      h('div.breathe', { text: 'atmen' }),
      h('p', { text: 'Atme 3-mal tief ein und aus, mit dem Kreis zusammen.' }),
      h('button.btn.big', { text: 'Los geht\'s! 🚀', onclick: skip })
    ]));
    ov.hidden = false;
    Capy.say(line || Capy.phrase('start'), 'happy');
    if (S.training) setTimeout(() => Capy.say(U.t(U.pick(PHRASES.missionAsk), { mission: S.opt.training.mission }), 'think'), 4200);
  }

  /* ---------- Aufgaben ---------- */
  function next() {
    if (S.idx >= S.queue.length) return finish();
    const item = S.queue[S.idx];
    const sk = X.byId(item.id), st = Store.skill(item.id);
    const lvl = item.lvl || st.level;
    const task = sk.gen(lvl);
    S.cur = { item, sk, lvl, task, attempts: 0, helped: false, t0: Date.now(), done: false, value: '' };
    renderTask();
  }

  function renderTask() {
    const { task, sk } = S.cur;
    const app = document.getElementById('app');
    app.innerHTML = '';
    // Fortschrittspfad: Capy wandert zum Ziel
    const pct = Math.round(S.idx / S.queue.length * 100);
    const trail = h('div.trail', {}, [h('div.trail-fill', { style: `width:${pct}%` }), h('div.trail-capy', { html: Capy.svg({ mood: 'happy' }), style: `left:calc(${pct}% * .86)` }), h('div.trail-goal', { text: S.training ? '🏆' : '🍊' })]);
    const head = h('div.row', { style: 'justify-content:space-between' }, [
      h('button.btn.soft', { text: '✕ Pause', style: 'min-height:48px;font-size:1rem', onclick: () => pauseMenu(true) }),
      h('span.muted', { style: 'font-family:var(--font)', text: `${sk.emo} ${sk.title} · Stufe ${S.cur.lvl}` })
    ]);
    const card = h('div.card.task-card');
    const say = task.say || [task.q, task.eq].filter(Boolean).join(' ');
    card.appendChild(h('div.task-q', {}, [h('p', { text: task.q }), h('button.icon-btn.small', { text: '🔈', 'aria-label': 'Aufgabe vorlesen', onclick: () => Sound.speak(say, true) })]));
    if (task.eq) { S.eqEl = h('div.eq'); card.appendChild(S.eqEl); drawEq(); } else S.eqEl = null;
    const stage = h('div.stage'); card.appendChild(stage);
    const api = { submit: (v, el) => submit(v, el) };
    S.widget = task.render ? task.render(stage, api) : null;
    S.helpBox = h('div.helpbox', { hidden: true }); card.appendChild(S.helpBox);
    const ans = h('div.answer-area'); card.appendChild(ans);
    buildInput(ans);
    card.appendChild(h('div.task-tools', {}, [h('button.btn.lila', { text: '💡 Hilfe', onclick: () => { if (!S.cur.done) showHelp(true); } })]));
    app.append(head, trail, card);
    S.card = card;
    Capy.hide(); Capy.setMood('happy'); Capy.bounce(); Sound.speak(say);
    clearTimeout(S.idle);
    S.idle = setTimeout(() => { if (!S.cur.done) Capy.say('Alles gut? Wenn du magst, tipp auf Hilfe. Ich bin da!', 'comfort'); }, 45000);
  }

  function drawEq() {
    const t = S.cur.task.eq;
    if (!S.eqEl) return;
    S.eqEl.innerHTML = '';
    const parts = t.split('_');
    S.eqEl.append(parts[0]);
    if (parts.length > 1) { S.eqEl.appendChild(h('span.gap', { text: S.cur.task.input === 'numpad' ? (S.cur.value || '?') : '?' })); S.eqEl.append(parts[1]); }
  }

  function buildInput(box) {
    const { task } = S.cur;
    if (task.input === 'numpad') {
      if (!task.eq || !task.eq.includes('_')) { S.display = h('div.display', { text: '?' }); box.appendChild(S.display); } else S.display = null;
      const pad = h('div.numpad');
      const upd = () => { drawEq(); if (S.display) S.display.textContent = S.cur.value || '?'; };
      [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].forEach(d => pad.appendChild(h('button', { text: d, onclick: () => { if (S.cur.done) return; if (S.cur.value.length < 3) { S.cur.value += d; Sound.play('tap'); upd(); } } })));
      pad.appendChild(h('button.del', { text: '⌫', 'aria-label': 'Löschen', onclick: () => { S.cur.value = S.cur.value.slice(0, -1); upd(); } }));
      pad.appendChild(h('button.ok', { text: '✓', 'aria-label': 'Fertig', style: 'grid-column: span 4', onclick: () => { if (S.cur.value !== '' && !S.cur.done) submit(Number(S.cur.value)); } }));
      box.appendChild(pad);
    } else if (task.input === 'choice') {
      const wrap = h('div.choices' + (task.clocks ? '.clock-choices' : ''));
      task.choices.forEach(c => {
        const b = h('button.choice' + (task.text ? '.text' : ''), { onclick: () => { if (!S.cur.done && !b.classList.contains('wrong')) submit(c, b); } });
        if (task.label) b.innerHTML = task.label(c); else b.textContent = c;
        wrap.appendChild(b);
      });
      box.appendChild(wrap);
    } else if (task.input === 'widget') {
      box.appendChild(h('button.btn.big', { text: 'Fertig ✓', onclick: () => { if (!S.cur.done) submit(S.widget.getValue()); } }));
    }
  }

  /* ---------- Antwort prüfen ---------- */
  function isRight(v) {
    const t = S.cur.task;
    if (t.check) return t.check(v);
    return String(v) === String(t.answer);
  }

  // Fehlerart merken (für Förderplan und Trainingsmissionen)
  function recordError(code) {
    const s = Store.skill(S.cur.item.id);
    s.errors[code] = (s.errors[code] || 0) + 1;
    s.errLog = [...(s.errLog || []), code].slice(-30);
    Store.save();
  }
  // Ergebnis einer Aufgabe merken
  function record(firstTry, solved) {
    const id = S.cur.item.id, s = Store.skill(id);
    s.tries++; s.lastSeen = U.today();
    s.hist = [...(s.hist || []), firstTry ? 1 : 0].slice(-30);
    if (firstTry) s.first++;
    if (solved) s.solved++;
    s.days[U.today()] = (s.days[U.today()] || 0) + 1;
    const r = S.results[id] || (S.results[id] = { n: 0, first: 0, solved: 0 });
    r.n++; if (firstTry) r.first++; if (solved) r.solved++;
    // Stufe anpassen (nur wenn die Aufgabe auf der aktuellen Stufe war)
    if (S.cur.lvl === s.level) {
      if (firstTry) { s.streak = (s.streak || 0) + 1; s.down = 0; if (s.streak >= 3 && s.level < 4) { s.level++; s.streak = 0; S.levelUp = X.byId(id).title; } }
      else { s.streak = 0; s.down = (s.down || 0) + 1; if (s.down >= 2 && s.level > 1) { s.level--; s.down = 0; } }
    }
    Store.save();
  }

  async function submit(v, el) {
    const c = S.cur, t = c.task;
    clearTimeout(S.idle);
    const fast = Date.now() - c.t0 < 1500;
    if (isRight(v)) {
      c.done = true;
      const firstTry = c.attempts === 0 && !c.helped;
      record(firstTry, true);
      S.hardRow = 0;
      S.coins += firstTry ? 2 : 1; Store.state.coins += firstTry ? 2 : 1;
      const afterExplain = S.afterExplain; S.afterExplain = false;
      if (!firstTry || afterExplain) { S.stars++; Store.state.stars++; }
      Store.save();
      Sound.play('ok');
      const r = (el || S.card).getBoundingClientRect();
      U.sparkle(r.left + r.width / 2, r.top + Math.min(r.height / 2, 200));
      if (el) el.classList.add('picked');
      S.card.classList.add('pop');
      let msg;
      if (!firstTry || afterExplain) msg = Capy.phrase('comeback');
      else if (t.strat && PHRASES.strategy[t.strat] && Math.random() < .5) msg = U.pick(PHRASES.strategy[t.strat]);
      else msg = Capy.phrase('correct');
      if (S.levelUp) { msg += ' Du bist bereit für die nächste Stufe!'; S.levelUp = null; }
      Capy.say(msg, 'cheer');
      await wait(1700);
      if (S && S.cur === c) { S.idx++; next(); }
      return;
    }
    // falsch
    c.attempts++;
    if (fast) S.fastWrong++;
    const code = t.analyze ? t.analyze(v) : 'sonst';
    recordError(code || 'sonst');
    Sound.play('oops');
    if (el) el.classList.add('wrong');
    if (t.onWrong) t.onWrong(v, el);
    S.card.classList.remove('shake'); void S.card.offsetWidth; S.card.classList.add('shake');
    c.value = ''; drawEq(); if (S.display) S.display.textContent = '?';
    if (c.attempts === 1) Capy.say(Capy.phrase('wrong') + ' ' + (t.hint || ''), 'comfort');
    else if (c.attempts === 2) { showHelp(false); }
    else { await explain(); return; }
    if (S.fastWrong >= 3 && S.pauses < 2) { S.fastWrong = 0; pauseMenu(false); }
  }

  function showHelp(asked) {
    const c = S.cur;
    c.helped = true;
    const box = S.helpBox;
    if (c.task.help) {
      box.innerHTML = '';
      const res = c.task.help(box);
      if (typeof res === 'string') { box.hidden = true; Capy.say(res, 'think'); return; }
      box.hidden = false;
    }
    Capy.say(asked ? 'Klar! Hilfe holen ist eine super Strategie. Schau mal!' : 'Schau, ich hab dir eine Hilfe hingelegt.', 'think');
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* Dritter Fehler: gemeinsam Schritt für Schritt, dann leichtere Aufgabe */
  async function explain() {
    const c = S.cur;
    c.done = true;
    record(false, false); // gezählt als nicht gelöst
    S.hardRow++; S.afterExplain = true;
    Capy.say(Capy.phrase('manyWrong'), 'comfort');
    const box = S.helpBox; box.innerHTML = ''; box.hidden = false;
    if (c.task.help && !c.task.reveal) { const r = c.task.help(box); if (typeof r === 'string') box.innerHTML = ''; }
    const steps = h('div.steps'); box.appendChild(steps);
    for (const [i, s] of (c.task.steps || []).entries()) {
      steps.appendChild(h('div', { text: s, style: `animation-delay:${i * .9}s` }));
    }
    if (c.task.reveal) c.task.reveal();
    else if (c.task.input !== 'widget' && !c.task.check) { c.value = String(c.task.answer); drawEq(); if (S.display) S.display.textContent = c.task.answer; }
    await wait(1200);
    Sound.speak((c.task.steps || []).join('. '));
    // leichtere Aufgabe direkt danach einschieben (garantiert Erfolg am Ende)
    if (S.queue.length < 14) S.queue.splice(S.idx + 1, 0, { id: c.item.id, lvl: Math.max(1, c.lvl - 1) });
    box.appendChild(h('button.btn.big', { text: 'Jetzt ich! ➜', onclick: () => {
      if (S.hardRow >= 2 && S.pauses < 2) { S.hardRow = 0; S.idx++; c.advance = true; pauseMenu(false); }
      else { S.idx++; next(); }
    } }));
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ---------- Pausen ---------- */
  function pauseMenu(asked) {
    S.pauses++;
    const ov = document.getElementById('overlay');
    const close = () => { ov.hidden = true; ov.innerHTML = ''; };
    const resume = () => { close(); if (!S) return; Capy.say(Capy.phrase('back'), 'happy'); if (S.cur && S.cur.advance) { S.cur.advance = false; next(); } };
    ov.innerHTML = '';
    const modal = h('div.modal', {}, [
      h('div.big-emoji', { text: '🌴' }),
      h('h2', { text: asked ? 'Pause' : 'Kurze Pause?' }),
      h('p', { text: asked ? 'Was möchtest du machen?' : 'Das war gerade ganz schön knifflig. Dein Gehirn freut sich über eine Mini-Pause.' }),
      h('div.row', { style: 'justify-content:center' }, [
        h('button.btn', { text: '💃 Tanzpause', onclick: () => App.breakDance(resume) }),
        h('button.btn', { text: '😂 Witz', onclick: () => App.joke(resume) }),
        h('button.btn', { text: '🌬️ Atmen', onclick: () => App.breathe(resume) })
      ]),
      h('button.btn.lila', { text: 'Weiter rechnen', onclick: resume }),
      asked ? h('button.btn.soft', { text: 'Für heute aufhören', onclick: () => { close(); finish(true); } }) : null
    ]);
    ov.appendChild(modal); ov.hidden = false;
    Capy.say(asked ? 'Klar, Pause ist wichtig!' : U.pick(PHRASES.pauseOffer), 'comfort');
  }

  /* ---------- Abschluss ---------- */
  function finish(early) {
    clearTimeout(S.idle);
    document.body.classList.remove('in-session');
    const st = Store.state;
    const ids = Object.keys(S.results);
    const solved = ids.reduce((a, id) => a + S.results[id].solved, 0);
    if (early && solved === 0) { S = null; App.go('map'); return; }
    const news = Coach.afterSession(ids, S.results);
    // Geschenke: 1 Gegenstand, Trainingsmission 2
    if (S.training) { S.stars++; st.stars++; }
    const gifts = [];
    const pool = ITEMS.filter(i => i.gift && !st.items.includes(i.id));
    const n = S.training ? 2 : 1;
    for (let i = 0; i < n; i++) {
      if (pool.length) { const it = pool.splice(Math.floor(Math.random() * pool.length), 1)[0]; st.items.push(it.id); gifts.push(it); }
      else { st.coins += 5; S.coins += 5; }
    }
    // Kapitel freischalten (Training: Bonus-Kapitel)
    const w = S.world, before = st.chapters[w] || 0;
    st.chapters[w] = Math.min(STORIES[w].chapters.length, before + (S.training ? 2 : 1));
    const newChapters = st.chapters[w] - before;
    // Sonder-Belohnung bei geschlossener Lücke
    news.forEach(nw => { if (nw.closedGap) st.unlocked.push('special-' + nw.id); });
    const firstTotal = ids.reduce((a, id) => a + S.results[id].first, 0);
    st.sessions.push({ date: new Date().toISOString(), world: w, skills: ids, solved, first: firstTotal, tasks: ids.reduce((a, id) => a + S.results[id].n, 0), stars: S.stars, coins: S.coins, training: S.training, newGems: news.map(x => x.id) });
    Store.save();
    const summary = { solved, stars: S.stars, coins: S.coins, gifts, world: w, newChapters, news, training: S.training };
    S = null;
    Screens.end(summary);
  }

  /* ---------- Startcheck: kurze Einstufung ohne Bewertung ---------- */
  function startcheck() {
    const plan = [['blitz', 2], ['freunde', 3], ['plus20', 1], ['plus20', 3], ['minus20', 3], ['buendeln', 1], ['analogie', 2], ['plus100', 3], ['mal', 1]];
    let i = 0; const res = [];
    document.body.classList.add('in-session');
    const run = () => {
      if (i >= plan.length) return done();
      const [id, lvl] = plan[i], sk = X.byId(id), task = sk.gen(lvl);
      const app = document.getElementById('app'); app.innerHTML = '';
      const card = h('div.card.task-card');
      card.appendChild(h('p.muted', { text: `Aufgabe ${i + 1} von ${plan.length} · Du darfst auch „Weiß ich nicht“ drücken.` }));
      card.appendChild(h('div.task-q', {}, [h('p', { text: task.q })]));
      let val = '';
      const eq = task.eq ? h('div.eq') : null;
      const drawE = () => { if (!eq) return; const p = task.eq.split('_'); eq.innerHTML = ''; eq.append(p[0]); if (p.length > 1) { eq.appendChild(h('span.gap', { text: val || '?' })); eq.append(p[1]); } };
      if (eq) { card.appendChild(eq); drawE(); }
      const stage = h('div.stage'); card.appendChild(stage);
      const answer = v => { const ok = task.check ? task.check(v) : String(v) === String(task.answer); res.push({ id, lvl, ok }); if (!ok && task.analyze) { const s = Store.skill(id); const c = task.analyze(v); if (c) s.errLog = [...(s.errLog || []), c]; } Sound.play('tap'); Capy.say(U.pick(['Danke!', 'Super, weiter!', 'Notiert!', 'Toll gemacht!', 'Okay, nächste!']), 'happy', { ms: 1500 }); i++; setTimeout(run, 600); };
      const w = task.render ? task.render(stage, { submit: v => answer(v) }) : null;
      const box = h('div.answer-area');
      if (task.input === 'numpad') {
        const pad = h('div.numpad');
        [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].forEach(d => pad.appendChild(h('button', { text: d, onclick: () => { if (val.length < 3) { val += d; drawE(); } } })));
        pad.appendChild(h('button.del', { text: '⌫', onclick: () => { val = val.slice(0, -1); drawE(); } }));
        pad.appendChild(h('button.ok', { text: '✓', style: 'grid-column: span 4', onclick: () => val !== '' && answer(Number(val)) }));
        box.appendChild(pad);
      } else if (task.input === 'choice') {
        const wrap = h('div.choices'); task.choices.forEach(c => { const b = h('button.choice' + (task.text ? '.text' : ''), { onclick: () => answer(c) }); if (task.label) b.innerHTML = task.label(c); else b.textContent = c; wrap.appendChild(b); }); box.appendChild(wrap);
      } else if (task.input === 'widget') box.appendChild(h('button.btn.big', { text: 'Fertig ✓', onclick: () => answer(w.getValue()) }));
      box.appendChild(h('button.btn.soft', { text: 'Weiß ich nicht 🤷', onclick: () => { res.push({ id, lvl, ok: false }); i++; run(); } }));
      card.appendChild(box); app.appendChild(card);
      Sound.speak(task.say || [task.q, task.eq].filter(Boolean).join(' '));
    };
    const done = () => {
      document.body.classList.remove('in-session');
      res.forEach(r => { const s = Store.skill(r.id); if (r.ok) s.level = Math.max(s.level, Math.min(4, r.lvl + (r.lvl >= 2 ? 0 : 1))); });
      const k1 = res.slice(0, 5).filter(r => r.ok).length, k2 = res.slice(5).filter(r => r.ok).length;
      const rec = k1 <= 3 ? 'w1' : k2 <= 2 ? 'w2' : 'w3';
      Store.state.recommended = rec; Store.state.startcheckDone = true; Store.save();
      Screens.startcheckResult(rec, k1, k2);
    };
    Capy.say('Ich will wissen, was du schon kannst. Das ist kein Test, nur zum Kennenlernen!', 'happy');
    run();
  }

  return { start, startcheck, get active() { return !!S; }, get current() { return S && S.cur; } };
})();

/* Abenteuer-Karte mit Mission des Tages und den drei Welten. */
window.Screens = window.Screens || {};
(function () {
  const { h } = U;
  const app = () => document.getElementById('app');
  const WORLDS = [
    { id: 'w1', emo: '🐸', title: 'Der Zahlenfluss', sub: 'Klasse 1 · Zahlen bis 20', story: 'Fünferbanden, Zehnerfreunde, Sprünge über die 10, Kiosk und Uhr.' },
    { id: 'w2', emo: '🌉', title: 'Die Hängebrücke', sub: 'Brücke 1 → 2 · auf dem Weg zur 100', story: 'Zehner bündeln, große Zahlen lesen, kleine Aufgaben helfen großen.' },
    { id: 'w3', emo: '🏙️', title: 'Land der großen Zahlen', sub: 'Klasse 2 · Zahlen bis 100', story: 'Rechenstrich, Einmaleins, Markt mit Wechselgeld, Turmuhr.' }
  ];
  Screens.WORLDS = WORLDS;

  function levelDots(lvl) { return h('span.lvl', { 'aria-label': `Stufe ${lvl} von 4` }, [1, 2, 3, 4].map(i => h('i' + (i <= lvl ? '.on' : '')))); }

  Screens.map = function () {
    const st = Store.state, a = app(); a.innerHTML = '';
    const m = Coach.missionOfDay();
    a.appendChild(h('div.screen-title', {}, [h('h1', { text: `Hallo ${st.name || 'Reporterin'}! 🎤` }), h('p.sub', { text: 'Wohin geht deine Reportage heute?' })]));
    // Mission des Tages
    const startMission = () => {
      if (m.type === 'training') Engine.start({ training: m, world: m.gap.skill.world });
      else Engine.start({ skills: [m.skill.id], world: m.skill.world });
    };
    a.appendChild(h('div.card.mission-day', {}, [
      h('div.md-icon', { text: m.type === 'training' ? '🆘' : m.skill.emo }),
      h('div', { style: 'display:flex;flex-direction:column;gap:10px;min-width:0' }, [
        h('h2', { text: m.type === 'training' ? 'Capy braucht deine Hilfe!' : 'Mission des Tages' }),
        h('p', { text: m.text }),
        m.type === 'training' ? h('p.muted', { text: 'Trainingsmission: doppelte Belohnung! 🎁🎁' }) : null,
        h('div.row', {}, [h('button.btn.big.lila', { text: 'Mission starten ▶', onclick: startMission })])
      ])
    ]));
    // Welten
    const grid = h('div.grid');
    WORLDS.forEach(w => {
      const r = Coach.worldReady(w.id), ch = st.chapters[w.id] || 0;
      const prog = Math.round((r.gems / r.total) * 100);
      const card = h('button.world-card.' + w.id, { onclick: () => Screens.world(w.id) }, [
        st.recommended === w.id ? h('span.tag', { text: '⭐ Empfohlen' }) : null,
        h('div.wc-emoji', { text: w.emo }), h('h3', { text: w.title }), h('p', { text: w.sub }),
        h('p.muted', { text: `💎 ${r.gems} von ${r.total} · 📖 ${ch} Kapitel` }),
        h('div.wc-bar', {}, [h('i', { style: `width:${Math.max(4, prog)}%` })])
      ]);
      grid.appendChild(card);
    });
    a.appendChild(grid);
    a.appendChild(h('div.grid', {}, [
      h('button.skill-tile', { onclick: () => Screens.films() }, [h('div.st-emoji', { text: '🎬' }), h('div', {}, [h('h3', { text: 'Capys Kino' }), h('div.st-meta', { text: 'Erklärfilme: Lernen, Zehnertrick, Uhr …' })])]),
      h('button.skill-tile', { onclick: () => App.breakDance(() => App.go('map')) }, [h('div.st-emoji', { text: '💃' }), h('div', {}, [h('h3', { text: 'Tanzpause' }), h('div.st-meta', { text: 'Bewegen wie die Tiere' })])]),
      h('button.skill-tile', { onclick: () => App.joke(() => { document.getElementById('overlay').hidden = true; }) }, [h('div.st-emoji', { text: '😂' }), h('div', {}, [h('h3', { text: 'Capy-Witz' }), h('div.st-meta', { text: 'Zum Lachen' })])])
    ]));
    if (!App.greeted) { App.greeted = true; Capy.say(m.type === 'training' ? m.text : Capy.phrase(st.sessions.length ? 'back' : 'start'), m.type === 'training' ? 'think' : 'happy'); }
  };

  Screens.world = function (wid) {
    const st = Store.state, w = WORLDS.find(x => x.id === wid), a = app(); a.innerHTML = '';
    const gapIds = Coach.gaps().map(g => g.skill.id);
    a.appendChild(h('div.world-head.' + wid, {}, [
      h('button.btn.soft', { text: '◀ Karte', style: 'min-height:52px', onclick: () => App.go('map') }),
      h('div', { style: 'min-width:0' }, [h('h1', { text: `${w.emo} ${w.title}` }), h('p.muted', { text: w.story })])
    ]));
    if (wid === 'w2') {
      // Brücke: jedes gemeisterte Thema und jedes Kapitel baut Bretter
      const planks = 20, built = Math.min(planks, (st.chapters.w2 || 0) * 2 + st.gems.filter(id => X.byId(id).world === 'w2').length * 2);
      a.appendChild(h('div.card', {}, [h('p', { style: 'font-family:var(--font)', text: `Brückenbretter: ${built} von ${planks}` }), h('div.bridge', {}, Array.from({ length: planks }, (_, i) => h('i' + (i < built ? '.on' : ''))))]));
    }
    const grid = h('div.grid');
    SKILLS.filter(s => s.world === wid).forEach(sk => {
      const stt = Coach.stat(sk.id), gem = Coach.isGem(sk.id), gap = gapIds.includes(sk.id);
      grid.appendChild(h('button.skill-tile' + (gap ? '.train' : ''), { onclick: () => Engine.start({ skills: [sk.id], world: wid }) }, [
        h('div.st-emoji', { text: sk.emo }),
        h('div', { style: 'min-width:0' }, [
          h('h3', { text: sk.title }),
          h('div.st-meta', {}, [levelDots(stt.level || 1), gem ? h('span', { text: '💎' }) : null, gap ? h('span', { text: '🆘 Capy braucht Hilfe' }) : null]),
          h('div.st-meta', { text: sk.desc })
        ])
      ]));
    });
    // Mix-Runde: alles aus dieser Welt gemischt (verteiltes Üben)
    const ids = SKILLS.filter(s => s.world === wid).map(s => s.id);
    grid.appendChild(h('button.skill-tile', { onclick: () => Engine.start({ skills: U.shuffle(ids), world: wid, count: 8 }) }, [
      h('div.st-emoji', { text: '🎲' }), h('div', {}, [h('h3', { text: 'Wilde Mischung' }), h('div.st-meta', { text: 'Von allem etwas, zum Wiederholen' })])
    ]));
    a.appendChild(grid);
    Capy.say(gapIds.some(id => ids.includes(id)) ? 'Bei den Aufgaben mit 🆘 brauche ich deine Hilfe!' : 'Such dir eine Reportage aus!', 'happy');
  };
})();

(function () {

  async function makePdf(btn, fn) {
    const old = btn.innerHTML; btn.disabled = true; btn.querySelector('h3') && (btn.querySelector('h3').textContent = 'Wird gemalt …');
    try { await fn(); Capy.say('Fertig! Du findest dein PDF jetzt zum Ausdrucken.', 'cheer'); }
    catch (e) { Capy.say('Hoppla, das PDF hat nicht geklappt. Probier es nochmal.', 'comfort'); }

  }

  /* ---------- Abschluss einer Einheit ---------- */
  Screens.end = function (sum) {
    const a = app(); a.innerHTML = '';
    const st = Store.state;
    Sound.play('win'); U.sparkle(null, null, 30);
    const newCreative = CREATIVE.find(c => c.need === st.sessions.length);
    const cards = [
      h('div.card.center', {}, [h('div.big-emoji', { text: '✅' }), h('h3', { text: `${sum.solved} Aufgaben gelöst` })]),
      h('div.card.center', {}, [h('div.big-emoji', { text: '⭐' }), h('h3', { text: `${sum.stars} Mutmach-Sterne` }), h('p.muted', { text: 'für Dranbleiben und Hilfe holen' })]),
      h('div.card.center', {}, [h('div.big-emoji', { text: '🪙' }), h('h3', { text: `+${sum.coins} Capy-Geld` })])
    ];
    a.appendChild(h('div.card.center', {}, [
      h('div', { html: Capy.svg({ mood: 'cheer', hat: st.items.includes('mandarine') }), style: 'width:150px' }),
      h('h1', { text: sum.training ? 'Mission erfüllt! Du hast Capy gerettet!' : 'Reportage geschafft!' })
    ]));
    // Edelsteine / geschlossene Lücken: große Feier
    sum.news.forEach(n => {
      const sk = X.byId(n.id);
      a.appendChild(h('div.card.center', { style: 'background:linear-gradient(135deg,#fff,#efe6fd);border:4px solid #ffc94d' }, [
        h('div.big-emoji', { text: '💎' }),
        h('h2', { text: `Neuer Edelstein: ${sk.gem}!` }),
        h('p', { text: n.closedGap ? 'Das war mal knifflig für dich, und jetzt kannst du es sicher. Du hast eine Lücke geschlossen! Dafür gibt es ein Sonder-Ausmalbild in deinen Schätzen.' : `Du kannst „${sk.title}“ jetzt richtig sicher. Ab in die Schatzkiste!` })
      ]));
      setTimeout(() => Capy.bounce('dance'), 600);
    });
    a.appendChild(h('div.grid', {}, cards));
    // Geschenke
    if (sum.gifts.length) a.appendChild(h('div.card.center', {}, [
      h('h2', { text: sum.gifts.length > 1 ? 'Zwei Geschenke für Capys Zimmer!' : 'Ein Geschenk für Capys Zimmer!' }),
      h('div.row', { style: 'justify-content:center' }, sum.gifts.map(g => h('div.shop-item.owned', {}, [h('div.si-emo', { text: g.emo }), h('b', { text: g.name })]))),
      h('button.btn', { text: '🏡 Ins Zimmer stellen', onclick: () => App.go('room') })
    ]));
    const row = [];
    if (sum.newChapters) row.push(h('button.btn.lila', { text: `📖 Neues Kapitel lesen`, onclick: () => Screens.story(sum.world, (st.chapters[sum.world] || 1) - 1) }));
    if (newCreative) row.push(h('button.btn.lila', { text: `${newCreative.emo} Neu: ${newCreative.title}`, onclick: () => App.go('treasure') }));
    if (row.length) a.appendChild(h('div.row', { style: 'justify-content:center' }, row));
    // Selbstreflexion mit Smileys
    const refl = { date: U.today() };
    const q = (key, text, opts) => h('div.rq', {}, [h('p', { style: 'font-family:var(--font);font-size:1.15rem', text }), h('div.smileys', {}, opts.map(([e, v]) => {
      const b = h('button', { text: e, 'aria-label': v, onclick: () => { refl[key] = v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); Sound.play('tap'); save(); } });
      return b;
    }))]);
    const save = () => { const rs = Store.state.reflections; if (rs.length && rs[rs.length - 1].date === refl.date && rs[rs.length - 1]._s === Store.state.sessions.length) rs[rs.length - 1] = { ...refl, _s: Store.state.sessions.length }; else rs.push({ ...refl, _s: Store.state.sessions.length }); Store.state.reflections = rs.slice(-60); Store.save(); };
    a.appendChild(h('div.card.reflect', {}, [
      h('h3', { text: 'Wie war es für dich?', style: 'text-align:center' }),
      q('easy', 'War es leicht oder knifflig?', [['😎', 'leicht'], ['🙂', 'mittel'], ['🤯', 'knifflig']]),
      q('feel', 'Wie fühlst du dich?', [['😄', 'super'], ['😐', 'okay'], ['😴', 'müde'], ['😣', 'genervt']])
    ]));
    a.appendChild(h('div.row', { style: 'justify-content:center' }, [
      h('button.btn', { text: '💃 Tanzpause', onclick: () => App.breakDance(() => {}) }),
      h('button.btn', { text: '😂 Witz', onclick: () => App.joke(() => {}) }),
      h('button.btn.big.lila', { text: 'Zur Karte 🗺️', onclick: () => App.go('map') })
    ]));
    Capy.say(Capy.phrase('end'), 'cheer');
  };

  /* ---------- Capys Zimmer und Shop ---------- */
  Screens.room = function () {
    const st = Store.state, a = app(); a.innerHTML = '';
    a.appendChild(h('div.screen-title', {}, [h('h1', { text: `🏡 ${st.buddy}s Zimmer` }), h('p.sub', { text: 'Zieh die Sachen dorthin, wo sie hinsollen. Ganz nach unten ziehen räumt sie weg.' })]));
    const room = h('div.room', {}, [h('div.room-capy', { html: Capy.svg({ mood: 'happy', hat: !!st.room.mandarine }) })]);
    const shelf = h('div.row');
    const draw = () => {
      room.querySelectorAll('.item').forEach(e => e.remove());
      Object.entries(st.room).forEach(([id, p]) => {
        const it = item(id); if (!it) return;
        const el = h('div.item', { text: it.emo, style: `left:${p.x}%;top:${p.y}%`, 'aria-label': it.name });
        el.addEventListener('pointerdown', e => {
          el.setPointerCapture(e.pointerId);
          const r = room.getBoundingClientRect();
          const mv = ev => { p.x = Math.max(4, Math.min(96, (ev.clientX - r.left) / r.width * 100)); p.y = Math.max(4, Math.min(110, (ev.clientY - r.top) / r.height * 100)); el.style.left = p.x + '%'; el.style.top = Math.min(96, p.y) + '%'; };
          const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); if (p.y > 100) delete st.room[id]; Store.save(); draw(); };
          el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
        });
        room.appendChild(el);
      });
      shelf.innerHTML = '';
      const loose = st.items.filter(id => !st.room[id]);
      if (!loose.length) shelf.appendChild(h('p.muted', { text: st.items.length ? 'Alles steht im Zimmer.' : 'Nach jeder Reportage bekommst du ein Geschenk für Capy.' }));
      loose.forEach(id => { const it = item(id); if (it) shelf.appendChild(h('button.shop-item', { style: 'min-height:96px;min-width:96px', onclick: () => { st.room[id] = { x: 15 + Math.random() * 70, y: 25 + Math.random() * 60 }; Sound.play('tap'); Store.save(); draw(); } }, [h('div.si-emo', { text: it.emo }), h('span', { text: it.name })])); });
    };
    a.append(room, h('div.card', {}, [h('h3', { text: 'Noch nicht im Zimmer (antippen)' }), shelf]));
    draw();
    // Shop: mit Capy-Geld bezahlen, Capy rechnet laut mit
    const shop = h('div.grid');
    let pending = null;
    ITEMS.filter(i => i.price).forEach(it => {
      const owned = st.items.includes(it.id);
      const b = h('button.shop-item' + (owned ? '.owned' : ''), {}, [h('div.si-emo', { text: it.emo }), h('b', { text: it.name }), h('span', { text: owned ? '✓ gehört dir' : `🪙 ${it.price}` })]);
      b.onclick = () => {
        if (owned) return;
        if (st.coins < it.price) { Capy.say(`Du hast ${st.coins} Capy-Geld. ${it.name} kostet ${it.price}. Es fehlen noch ${it.price - st.coins}. Noch ein paar Reportagen!`, 'think'); return; }
        if (pending !== it.id) { pending = it.id; Capy.say(`Du hast ${st.coins}. ${it.name} kostet ${it.price}. Dann bleiben dir ${st.coins - it.price}. Nochmal tippen zum Kaufen!`, 'think'); b.lastChild.textContent = 'Kaufen? Tippen ✓'; return; }
        st.coins -= it.price; st.items.push(it.id); Store.save(); Sound.play('coin'); U.sparkle();
        Capy.say(`Juhu, ${it.name}! Danke!`, 'cheer'); Screens.room();
      };
      shop.appendChild(b);

    const chk = (id, label, key) => { const c = h('input#' + id, { type: 'checkbox', style: 'width:28px;height:28px' }); c.checked = !!st.settings[key]; c.onchange = () => { st.settings[key] = c.checked; Store.save(); App.applySettings(); }; return h('label.row', { for: id, style: 'min-height:48px' }, [c, label]); };
    a.appendChild(h('div.card', {}, [h('h3', { text: 'Namen' }), h('div.row', {}, [h('label', { for: 'setName', text: 'Kind:' }), name, h('label', { for: 'setBuddy', text: 'Lernbuddy:' }), buddy, h('button.btn', { text: 'Speichern', onclick: () => { st.name = name.value.trim() || 'Reporterin'; st.buddy = buddy.value.trim() || 'Capy'; Store.save(); App.refreshBrand(); Capy.say(`Hallo ${st.name}, ich bin ${st.buddy}!`, 'cheer'); } })])]));
    a.appendChild(h('div.card', {}, [h('h3', { text: 'Ton und Bewegung' }), chk('setSound', 'Töne und Vorlesen an', 'sound'), chk('setSpeech', 'Capy liest Aufgaben automatisch vor', 'speech'), chk('setCalm', 'Ruhiger Modus (weniger Animationen)', 'calm')]));
    a.appendChild(voiceCard());
    a.appendChild(h('div.card', {}, [h('h3', { text: 'Neu starten' }), h('div.row', {}, [
      h('button.btn.soft', { text: '🧠 „Was ist Lernen?“ zeigen', onclick: () => Screens.intro() }),
      h('button.btn.soft', { text: '🔍 Startcheck wiederholen', onclick: () => Engine.startcheck() })
    ])]));
    a.appendChild(dataCard());
  }

  /* Capys Stimme: Auswahl, Voreinstellungen, Tonlage, Tempo, Probehören */
  function voiceCard() {
    const st = Store.state, set = st.settings;
    const card = h('div.card');
    const draw = () => {
      card.innerHTML = '';
      card.appendChild(h('h3', { text: '🎙️ Capys Stimme' }));
      if (!Sound.hasTTS) { card.appendChild(h('p', { text: 'Dieser Browser hat keine Sprachausgabe. Auf dem iPad bitte Safari verwenden.' })); return; }
      const vs = Sound.germanVoices();
      const cur = Sound.voice;
      const pitch = set.pitch != null ? set.pitch : Sound.PRESETS.kind.pitch, rate = set.rate != null ? set.rate : Sound.PRESETS.kind.rate;
      const sample = `Hallo ${st.name || 'Reporterin'}! Ich bin ${st.buddy}. Wie viel ist acht plus fünf? Erst bis zur Zehn, dann weiter. Dreizehn! Super gemacht!`;
      const test = () => Sound.speak(sample, true);
      if (!vs.length) card.appendChild(h('p', { text: 'Auf diesem Gerät wurde noch keine deutsche Stimme gefunden. Bitte unten die Anleitung beachten.' }));
      else {
        const sel = h('select#voiceSel', { style: 'font:inherit;padding:10px;border-radius:12px;min-height:48px;max-width:100%' }, vs.map((v, i) => h('option', { value: v.voiceURI, selected: cur && v.voiceURI === cur.voiceURI, text: `${v.name} · ${Sound.quality(v)}${i === 0 ? ' · empfohlen' : ''}${v.localService ? '' : ' · online'}` })));
        sel.onchange = () => { set.voiceURI = sel.value; Store.save(); Sound.pickVoice(); draw(); test(); };
        card.append(h('label', { for: 'voiceSel', text: 'Stimme: ' }), sel);
        if (cur && !cur.localService) card.appendChild(h('p.muted', { style: 'margin-top:6px', text: 'Hinweis: Diese Online-Stimme schickt die vorgelesenen Sätze an den Anbieter des Browsers. Für maximalen Datenschutz eine Stimme ohne „online“ wählen.' }));
      }
      card.appendChild(h('p', { style: 'margin-top:14px;font-weight:bold', text: 'Klang' }));
      card.appendChild(h('div.row', {}, Object.entries(Sound.PRESETS).map(([k, p]) => h('button.btn.soft', { style: 'min-height:52px;font-size:1rem', text: p.label, onclick: () => { set.pitch = p.pitch; set.rate = p.rate; Store.save(); draw(); test(); } }))));
      const slider = (id, label, min, max, step, val, key, fmt) => {
        const out = h('span', { text: fmt(val) });
        const s = h('input#' + id, { type: 'range', min, max, step, value: val, style: 'width:min(100%,320px);height:36px' });
        s.oninput = () => { out.textContent = fmt(Number(s.value)); };
        s.onchange = () => { set[key] = Number(s.value); Store.save(); test(); };
        return h('div.row', { style: 'margin-top:8px' }, [h('label', { for: id, style: 'min-width:110px', text: label }), s, out]);
      };
      card.appendChild(slider('pitchIn', 'Tonlage', .8, 2, .05, pitch, 'pitch', v => v < 1.15 ? 'erwachsen' : v < 1.5 ? 'jung' : v < 1.8 ? 'kindlich und niedlich' : 'sehr hell'));
      card.appendChild(slider('rateIn', 'Tempo', .7, 1.4, .05, rate, 'rate', v => v < .9 ? 'langsam' : v <= 1.05 ? 'normal' : v <= 1.2 ? 'flott' : 'sehr schnell'));
      card.appendChild(h('div.row', { style: 'margin-top:12px' }, [h('button.btn', { text: '▶ Probehören', onclick: test })]));
      card.appendChild(h('details', { style: 'margin-top:16px' }, [
        h('summary', { style: 'cursor:pointer;font-weight:bold;min-height:44px', text: 'So klingt Capy auf dem iPad am natürlichsten' }),
        h('ol', { style: 'line-height:1.5;padding-left:20px' }, [
          'iPad: Einstellungen öffnen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Deutsch.',
          'Eine weibliche Stimme mit dem Zusatz „Erweitert“ oder „Premium“ antippen und laden (z. B. Anna oder Petra). Das dauert einen Moment und braucht WLAN.',
          'Safari neu öffnen, dann hier die neue Stimme auswählen und „Kinderstimme (Capy)“ antippen.',
          'Am Computer klingen im Browser Microsoft Edge die Stimmen mit „Natural“ im Namen besonders echt. Diese laufen aber online.'
        ].map(t => h('li', { text: t }))),
        h('p.muted', { text: 'Hinweis: Echte Kinderstimmen bieten Geräte nicht an. Capy hebt eine natürliche Stimme etwas an und spricht mit kindlicher Melodie. Am authentischsten wären selbst aufgenommene Sätze.' })
      ]));
    };
    draw();
    if (Sound.hasTTS && !Sound.germanVoices().length) setTimeout(draw, 800); // Stimmen laden manchmal verzögert
    return card;
  }

  Screens.lockParents =() => { unlocked = false; document.getElementById('app').classList.remove('parents'); };
})();

/* ===== js/app.js ===== */
/* App: Navigation, Zähler, Pausen (Tanz, Witz, Atmen) und Start. */
window.App = (function () {
  const { h } = U;
  const ov = () => document.getElementById('overlay');

  function go(name) {
    Sound.stop();
    if (name !== 'parents') Screens.lockParents();
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.go === name));
    const app = document.getElementById('app');
    ({ map: Screens.map, room: Screens.room, stories: Screens.stories, treasure: Screens.treasure, parents: Screens.parents })[name]();
    window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }

  function refreshCounters() {
    const st = Store.state;
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    set('cStars', st.stars); set('cCoins', st.coins); set('cGems', st.gems.length);
  }
  function refreshBrand() {
    document.getElementById('brandCapy').innerHTML = Capy.svg({ mood: 'happy' });
    Capy.setMood('happy');
  }
  function applySettings() {
    const s = Store.state.settings;
    document.getElementById('soundBtn').textContent = s.sound ? '🔊' : '🔇';
    document.body.classList.toggle('calm', !!s.calm);
  }

  /* Tanzpause mit Countdown */
  function breakDance(done) {
    const m = U.pick(MOVES); let t = 20;
    const cd = h('div.countdown', { text: t });
    const close = () => { clearInterval(iv); ov().hidden = true; ov().innerHTML = ''; done && done(); };
    ov().innerHTML = '';
    ov().appendChild(h('div.modal', {}, [h('div.big-emoji', { text: m.emo }), h('h2', { text: 'Tanzpause!' }), h('p', { style: 'font-family:var(--font);font-size:1.3rem', text: m.text }), cd, h('button.btn', { text: 'Fertig! ✓', onclick: close })]));
    ov().hidden = false;
    Capy.say(m.text, 'cheer'); Capy.bounce('dance');
    const iv = setInterval(() => { t--; cd.textContent = t; if (t <= 0) { Sound.play('win'); close(); } }, 1000);
  }
  function joke(done) {
    const j = U.pick(JOKES), [q, ...rest] = j.split('?');
    const ans = h('p', { style: 'font-family:var(--font);font-size:1.4rem', text: rest.join('?').trim(), hidden: true });
    const close = () => { ov().hidden = true; ov().innerHTML = ''; done && done(); };
    ov().innerHTML = '';
    ov().appendChild(h('div.modal', {}, [h('div.big-emoji', { text: '😂' }), h('p', { style: 'font-family:var(--font);font-size:1.4rem', text: q + (rest.length ? '?' : '') }), ans,
      rest.length ? h('button.btn.lila', { text: 'Auflösung!', onclick: e => { ans.hidden = false; e.target.remove(); Sound.speak(ans.textContent, true); } }) : null,
      h('button.btn', { text: 'Weiter', onclick: close })]));
    ov().hidden = false;
    Sound.speak(q + '?');
  }
  function breathe(done) {
    const close = () => { ov().hidden = true; ov().innerHTML = ''; done && done(); };
    ov().innerHTML = '';
    ov().appendChild(h('div.modal', {}, [h('h2', { text: 'Capy-Atmung' }), h('div.breathe', { text: 'ein … aus' }), h('p', { text: 'Wenn der Kreis groß wird: einatmen. Wird er klein: ausatmen. 3-mal.' }), h('button.btn', { text: 'Fertig ✓', onclick: close })]));
    ov().hidden = false;
    Capy.say('Atme mit dem Kreis. Ganz ruhig.', 'comfort');
  }

  function init() {
    refreshBrand(); refreshCounters(); applySettings();
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { if (!Engine.active) go(t.dataset.go); }));
    document.getElementById('homeBtn').addEventListener('click', () => { if (!Engine.active) go('map'); });
    document.getElementById('soundBtn').addEventListener('click', () => { const s = Store.state.settings; s.sound = !s.sound; Store.save(); applySettings(); if (!s.sound) Sound.stop(); else { Sound.unlock(); Sound.play('ok'); } });
    document.getElementById('speakBtn').addEventListener('click', () => Capy.repeat());
    // Capy antippen: Mutmach-Satz, eigene Geschichte oder Witz
    document.getElementById('buddyCapy').addEventListener('click', () => {
      Sound.unlock();
      const r = Math.random();
      if (r < .4) Capy.say(Capy.phrase('start'), 'cheer');
      else if (r < .75) Capy.say(U.pick(PHRASES.capyStory), 'happy');
      else Capy.say(U.pick(JOKES), 'cheer');
    });
    document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
    // Rückkehr nach längerer Abwesenheit
    const st = Store.state;
    const away = st.lastVisit ? Date.now() - st.lastVisit : 0;
    st.lastVisit = Date.now(); Store.save();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (Date.now() - Store.state.lastVisit > 10 * 60e3) Capy.say(Capy.phrase('back'), 'happy'); Store.state.lastVisit = Date.now(); Store.save(); } });

    if (!st.name) Screens.welcome();
    else if (!st.introSeen) Screens.intro();
    else if (!st.startcheckDone) Screens.startcheckIntro();
    else go('map');
    // Offline-Nutzung (nur wenn als echte Website geladen)
    try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }

  return { go, refreshCounters, refreshBrand, applySettings, breakDance, joke, breathe, init, greeted: false };
})();
document.addEventListener('DOMContentLoaded', App.init);

</script>
