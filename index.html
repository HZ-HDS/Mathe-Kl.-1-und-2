<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Capys Mathe-Regenwald</title>
<meta name="description" content="Spielerische Matheübungen für Klasse 1 und 2 mit Capy, dem Capybara-Lernbuddy.">
<meta name="theme-color" content="#bfe6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capy Mathe">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Capys Mathe-Regenwald – Gestaltung
   Layout: eine klare Aufgabe pro Bildschirm, Capy unten links, Navigation unten.
   Bewusst ein helles Farbschema (Hellblau, Lila, Glitzer) für ein 7-jähriges Kind. */
:root {
  color-scheme: light;
  --sky: #d6efff;          /* Himmel, Grundfläche */
  --sky-deep: #a9dcfb;
  --blue: #3f9fe0;         /* Hauptfarbe */
  --blue-ink: #1d5f96;
  --lila: #9a72dd;         /* Akzent */
  --lila-soft: #efe6fd;
  --lila-ink: #5b3a99;
  --leaf: #4fae74;         /* Regenwald-Grün, sparsam */
  --sun: #ffc94d;
  --peach: #ff9f7a;
  --card: #ffffff;
  --ink: #2b2550;          /* Text */
  --ink-soft: #5f5a80;
  --dot-red: #ef5b6b;
  --dot-blue: #3f8fe0;
  --ok: #3aa86b;
  --radius: 22px;
  --shadow: 0 6px 0 rgba(43, 37, 80, .10), 0 10px 24px rgba(63, 159, 224, .16);
  --font: "Arial Rounded MT Bold", "Avenir Next Rounded", "Nunito", "Varela Round", "Comic Neue", ui-rounded, system-ui, sans-serif;
  --font-body: "Avenir Next", "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Welt-Farbstimmungen */
  --w1: #4aa8ea; --w1-soft: #dcf1ff;
  --w2: #7d8cf0; --w2-soft: #e6e9ff;
  --w3: #9a6ad8; --w3-soft: #f0e6ff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 85% -10%, #f3e9ff 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #c9f0dc 0%, transparent 55%),
    linear-gradient(180deg, var(--sky) 0%, #e8f6ff 60%, #f4eeff 100%);
  background-color: var(--sky);
  background-attachment: fixed;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
h1, h2, h3 { font-family: var(--font); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); }
h2 { font-size: clamp(1.35rem, 3.4vw, 1.8rem); }
h3 { font-size: 1.15rem; }
p { line-height: 1.5; margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 4px solid var(--lila); outline-offset: 3px; border-radius: 12px; }

/* ---------- Kopfzeile ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(255, 255, 255, .78);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 3px solid var(--sky-deep);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 0; min-width: 0; }
.brand-capy { width: 46px; height: 46px; flex: none; }
.brand-text { font-family: var(--font); font-size: 1.15rem; color: var(--blue-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.counters { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
.counter {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px;
  background: var(--lila-soft); border-radius: 999px; font-family: var(--font);
  font-variant-numeric: tabular-nums; color: var(--lila-ink);
}
.icon-btn {
  min-width: 48px; min-height: 48px; border-radius: 50%; border: 0;
  background: #fff; box-shadow: var(--shadow); font-size: 1.3rem; cursor: pointer;
}
.icon-btn.small { min-width: 40px; min-height: 40px; font-size: 1.05rem; box-shadow: none; background: var(--lila-soft); }

/* ---------- Hauptbereich ---------- */
#app {
  max-width: 1040px; margin: 0 auto; outline: none;
  padding-block: 18px 210px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.screen-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.screen-title .sub { color: var(--ink-soft); font-size: 1.05rem; width: 100%; }
.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; min-width: 0;
}
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.muted { color: var(--ink-soft); }

/* Große, freundliche Knöpfe (mind. 60 px) */
.btn {
  min-height: 62px; padding: 12px 26px; border-radius: 999px; border: 0; cursor: pointer;
  font-family: var(--font); font-size: 1.2rem; color: #fff;
  background: linear-gradient(180deg, #5cb6f2, var(--blue));
  box-shadow: 0 5px 0 var(--blue-ink); transition: transform .08s;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--blue-ink); }
.btn.lila { background: linear-gradient(180deg, #b393ea, var(--lila)); box-shadow: 0 5px 0 var(--lila-ink); }
.btn.lila:active { box-shadow: 0 1px 0 var(--lila-ink); }
.btn.soft { background: #fff; color: var(--blue-ink); box-shadow: 0 5px 0 var(--sky-deep); }
.btn.soft:active { box-shadow: 0 1px 0 var(--sky-deep); }
.btn.big { min-height: 76px; font-size: 1.45rem; padding-inline: 36px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- Karte / Welten ---------- */
.mission-day {
  display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center;
  background: linear-gradient(135deg, #fff 0%, var(--lila-soft) 100%);
  border: 3px solid #d9c7f8;
}
.mission-day .md-icon { font-size: 3.4rem; text-align: center; }
.mission-day h2 { color: var(--lila-ink); }
.world-card {
  border: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
  padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); min-height: 190px;
  position: relative; overflow: hidden;
}
.world-card .wc-emoji { font-size: 2.8rem; }
.world-card h3 { font-size: 1.3rem; }
.world-card .wc-bar { height: 14px; border-radius: 99px; background: rgba(255,255,255,.7); overflow: hidden; margin-top: auto; }
.world-card .wc-bar i { display: block; height: 100%; background: currentColor; border-radius: 99px; }
.world-card.w1 { background: var(--w1-soft); color: var(--w1); }
.world-card.w2 { background: var(--w2-soft); color: var(--w2); }
.world-card.w3 { background: var(--w3-soft); color: var(--w3); }
.world-card h3, .world-card p { color: var(--ink); }
.world-card .tag { position: absolute; top: 14px; right: 14px; background: #fff; color: var(--lila-ink); font-family: var(--font); font-size: .85rem; padding: 4px 10px; border-radius: 99px; }

.skill-tile {
  border: 0; cursor: pointer; text-align: left; background: #fff; border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center;
  min-height: 96px; position: relative;
}
.skill-tile .st-emoji { font-size: 2.6rem; text-align: center; }
.skill-tile h3 { font-size: 1.1rem; }
.skill-tile .st-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: .95rem; color: var(--ink-soft); flex-wrap: wrap; }
.skill-tile.train { outline: 4px dashed var(--lila); outline-offset: -4px; }
.lvl { display: inline-flex; gap: 2px; }
.lvl i { width: 12px; height: 12px; border-radius: 50%; background: #e4e0f2; display: inline-block; }
.lvl i.on { background: var(--sun); box-shadow: 0 0 0 2px #f2b52a inset; }
.world-head { border-radius: var(--radius); padding: 18px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.world-head.w1 { background: var(--w1-soft); } .world-head.w2 { background: var(--w2-soft); } .world-head.w3 { background: var(--w3-soft); }

/* Brücke: Bretter */
.bridge { display: flex; gap: 4px; align-items: flex-end; height: 40px; padding: 0 6px; border-bottom: 4px solid #8a6a45; }
.bridge i { flex: 1; height: 18px; background: #e9e4f5; border-radius: 4px; }
.bridge i.on { background: #b98a5a; }

/* ---------- Übungsbildschirm ---------- */
.session { display: flex; flex-direction: column; gap: 14px; }
.trail { position: relative; height: 54px; border-radius: 99px; background: #fff; box-shadow: var(--shadow); overflow: hidden; }
.trail .trail-fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #c9f0dc, #bfe6ff 60%, #e6d8fb); transition: width .6s; }
.trail .trail-capy { position: absolute; top: 3px; width: 48px; height: 48px; transition: left .6s; }
.trail .trail-goal { position: absolute; right: 10px; top: 8px; font-size: 1.8rem; }
.task-card { display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; padding: 22px 18px; }
.task-q { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }
.task-q p { font-family: var(--font); font-size: clamp(1.25rem, 3.2vw, 1.6rem); }
.eq { font-family: var(--font); font-size: clamp(2.4rem, 7vw, 3.6rem); color: var(--blue-ink); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.eq .gap { display: inline-block; min-width: 1.4em; border-bottom: 6px solid var(--lila); color: var(--lila); }
.stage { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.helpbox { width: 100%; background: var(--lila-soft); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.helpbox .steps { display: flex; flex-direction: column; gap: 8px; font-family: var(--font); font-size: 1.35rem; }
.helpbox .steps div { opacity: 0; transform: translateY(8px); animation: stepIn .5s forwards; }
@keyframes stepIn { to { opacity: 1; transform: none; } }
.answer-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.task-tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.task-tools .btn { min-height: 54px; font-size: 1.05rem; padding-inline: 18px; }

/* Ziffernblock */
.numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: min(100%, 520px); }
.numpad button {
  min-height: 64px; border-radius: 18px; border: 0; background: #fff; font-family: var(--font); font-size: 1.7rem;
  box-shadow: 0 4px 0 var(--sky-deep); cursor: pointer; color: var(--blue-ink);
}
.numpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-deep); }
.numpad .ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 #2a7a4e; }
.numpad .del { background: var(--lila-soft); color: var(--lila-ink); box-shadow: 0 4px 0 #d3c1f3; }
.display { min-width: 140px; min-height: 72px; padding: 6px 18px; border-radius: 18px; background: #fff; border: 4px solid var(--sky-deep); font-family: var(--font); font-size: 2.6rem; color: var(--lila-ink); font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; }
.choices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.choice {
  min-width: 96px; min-height: 84px; padding: 10px 18px; border-radius: 22px; border: 0; background: #fff;
  font-family: var(--font); font-size: 2rem; color: var(--blue-ink); box-shadow: 0 5px 0 var(--sky-deep); cursor: pointer;
}
.choice.text { font-size: 1.3rem; }
.choice:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sky-deep); }
.choice.wrong { opacity: .4; }
.choice.picked { background: #fff6d6; box-shadow: 0 5px 0 var(--sun); }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pop { animation: pop .45s; }
@keyframes pop { 50% { transform: scale(1.12); } }

/* ---------- Mathe-Material ---------- */
.field20 { display: grid; gap: 8px; touch-action: none; }
.field20 .frow { display: grid; grid-template-columns: repeat(5, 1fr) 10px repeat(5, 1fr); gap: 6px; }
.field20 .cell { width: clamp(30px, 6.6vw, 50px); aspect-ratio: 1; border-radius: 10px; background: #fff; border: 3px solid #b9dcf5; display: grid; place-items: center; }
.field20 .cell.tap { cursor: pointer; }
.field20 .dot { width: 76%; aspect-ratio: 1; border-radius: 50%; }
.dot.r { background: radial-gradient(circle at 35% 30%, #ff98a3, var(--dot-red)); }
.dot.b { background: radial-gradient(circle at 35% 30%, #8cc3ff, var(--dot-blue)); }
.dot.g { background: radial-gradient(circle at 35% 30%, #9be0b4, var(--leaf)); }
.dot.x { background: repeating-linear-gradient(45deg, #ccc 0 4px, #eee 4px 8px); opacity: .7; }
.cover { position: relative; }
.cover .leaves { position: absolute; inset: -8px; border-radius: 18px; background: linear-gradient(135deg, #5fbf86, #3d9a66); display: grid; place-items: center; font-size: 3rem; animation: growIn .35s; }
@keyframes growIn { from { transform: scale(.4); opacity: 0; } }
.groups { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: clamp(1.7rem, 5vw, 2.4rem); }
.groups .grp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px 4px; padding: 8px 10px; background: #fff; border-radius: 16px; border: 3px dashed var(--sky-deep); }
.groups .grp.wide { grid-template-columns: repeat(10, 1fr); }
.wing-wrap { display: flex; align-items: center; gap: 0; }
.wing { display: grid; grid-template-columns: repeat(5, 22px); gap: 6px; padding: 18px; background: linear-gradient(135deg, #d8c4fb, #b8e2ff); }
.wing.l { border-radius: 60% 10% 10% 60% / 60% 20% 20% 60%; }
.wing.r { border-radius: 10% 60% 60% 10% / 20% 60% 60% 20%; }
.wing .dot { width: 22px; height: 22px; }
.wing .dot.ghost { background: transparent; border: 3px dashed var(--lila); }
.body-bar { width: 16px; height: 120px; border-radius: 10px; background: var(--lila-ink); }

/* Geld */
.money-tray { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 92px; width: 100%; padding: 12px; background: #fff7e2; border: 4px dashed var(--sun); border-radius: 20px; }
.money-src { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.coin { border: 0; cursor: pointer; padding: 0; background: none; }
.coin svg { display: block; }
.price-tag { display: inline-flex; align-items: center; gap: 12px; background: #fff; padding: 10px 18px; border-radius: 18px; box-shadow: var(--shadow); font-family: var(--font); font-size: 1.6rem; }
.price-tag .emo { font-size: 2.6rem; }
.sum-line { font-family: var(--font); font-size: 1.3rem; color: var(--ink-soft); }

/* Uhr */
.clock-svg { width: min(78vw, 260px); height: auto; touch-action: none; }
.clock-choices .choice svg { width: 110px; height: 110px; }

/* Zehner/Einer, Hundertertafel */
.place { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; justify-content: center; min-height: 150px; }
.tens { display: flex; gap: 6px; align-items: flex-end; }
.ten-bar { width: 18px; height: 140px; border-radius: 6px; display: grid; grid-template-rows: repeat(10, 1fr); gap: 2px; padding: 2px; background: #2f6fb0; cursor: pointer; }
.ten-bar i { background: #79b8f0; border-radius: 3px; }
.ones { display: grid; grid-template-columns: repeat(5, 22px); gap: 4px; }
.one { width: 22px; height: 22px; border-radius: 5px; background: #f0a33a; box-shadow: inset 0 -3px 0 #c97d1b; cursor: pointer; }
.zetafel { display: grid; grid-template-columns: 1fr 1fr; border-radius: 16px; overflow: hidden; border: 3px solid var(--sky-deep); font-family: var(--font); text-align: center; min-width: 200px; }
.zetafel div { padding: 6px 14px; font-size: 1.8rem; background: #fff; }
.zetafel .h { background: var(--w2-soft); font-size: 1.1rem; }
.hundert { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; width: min(100%, 520px); }
.hundert button { aspect-ratio: 1; border: 0; border-radius: 8px; background: #fff; font-family: var(--font); font-size: clamp(.8rem, 2.4vw, 1.15rem); color: var(--blue-ink); cursor: pointer; padding: 0; }
.hundert button.row-hl { background: var(--w2-soft); }
.hundert button.five { box-shadow: inset 0 -3px 0 #d8d2f7; }
.hundert button.hit { background: var(--sun); }
.hundert button.miss { background: #f2eefb; color: #b5addb; }

/* Rechenstrich */
.rstrich { width: 100%; max-width: 640px; overflow-x: auto; }
.rstrich svg { width: 100%; height: auto; min-width: 320px; }

/* Malfeld */
.array { display: inline-grid; gap: 6px; padding: 12px; background: #fff; border-radius: 16px; }
.array .arow { display: flex; gap: 4px; padding: 4px 8px; border-radius: 99px; background: var(--w3-soft); }
.array .arow.hl { background: #ffe9a8; }
.array .arow span { font-size: 1.6rem; }

/* ---------- Feedback, Glitzer ---------- */
#glitter { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.spark { position: absolute; font-size: 1.6rem; animation: spark 1.2s ease-out forwards; }
@keyframes spark { 0% { transform: translate(0,0) scale(.4) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(200deg); opacity: 0; } }

/* ---------- Capy-Buddy ---------- */
.buddy {
  position: fixed; z-index: 30; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: flex-end; gap: 0; flex-direction: row-reverse; justify-content: flex-end; pointer-events: none;
  max-width: calc(100vw - 20px);
}
.buddy-capy { width: 112px; height: 112px; border: 0; background: none; padding: 0; cursor: pointer; pointer-events: auto; flex: none; }
.buddy-capy svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 8px rgba(43, 37, 80, .18)); }
.buddy-capy.bounce svg { animation: bounce .7s; }
.buddy-capy.dance svg { animation: dance 1.1s 2; }
@keyframes bounce { 30% { transform: translateY(-16px); } 60% { transform: translateY(0); } 80% { transform: translateY(-5px); } }
@keyframes dance { 25% { transform: rotate(-12deg) translateY(-8px); } 50% { transform: rotate(0); } 75% { transform: rotate(12deg) translateY(-8px); } }
.bubble {
  pointer-events: auto; position: relative; margin-bottom: 70px; margin-left: -6px; max-width: min(430px, calc(100vw - 150px));
  background: #fff; border-radius: 22px; padding: 12px 12px 12px 16px; box-shadow: var(--shadow); border: 3px solid #d9c7f8;
  display: flex; gap: 8px; align-items: center; animation: growIn .25s;
}
.bubble p { font-family: var(--font); font-size: 1.08rem; line-height: 1.35; }
.bubble::after { content: ""; position: absolute; left: -12px; bottom: 16px; border: 10px solid transparent; border-right-color: #d9c7f8; }

/* ---------- Navigation unten ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 3px solid var(--sky-deep);
}
.tab { border: 0; background: none; min-height: 64px; border-radius: 16px; font-family: var(--font); font-size: .9rem; color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
.tab span { font-size: 1.6rem; }
.tab.on { background: var(--lila-soft); color: var(--lila-ink); }
body.in-session .tabbar { display: none; }
body.in-session .buddy { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
body.in-session #app { padding-bottom: 150px; }
body.in-session .buddy, body.in-session .bubble { pointer-events: none; }
body.in-session .bubble .icon-btn { display: none; }
body.in-session .buddy-capy { width: 80px; height: 80px; }
body.in-session .bubble { margin-bottom: 44px; opacity: .97; }

/* ---------- Overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(43, 37, 80, .45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: #fff; border-radius: 28px; padding: 24px; width: min(560px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; animation: growIn .25s; }

/* Kleine Hilfsfunktionen, die überall gebraucht werden. */
window.U = (function () {
  // Element bauen: h('div.card', {onclick}, [kinder])
  function h(sel, attrs, kids) {
    const m = sel.split(/(?=[.#])/);
    const e = document.createElement(m[0] || 'div');
    m.slice(1).forEach(p => p[0] === '.' ? e.classList.add(p.slice(1)) : (e.id = p.slice(1)));
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'style') e.style.cssText = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    (Array.isArray(kids) ? kids : kids != null ? [kids] : []).flat().forEach(k => {
      if (k == null || k === false) return;
      e.appendChild(typeof k === 'string' || typeof k === 'number' ? document.createTextNode(String(k)) : k);
    });
    return e;
  }
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const uniq = a => [...new Set(a)];
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dateDE = (d = new Date()) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
  function season(d = new Date()) {
    const m = d.getMonth() + 1;
    return m >= 3 && m <= 5 ? 'fruehling' : m <= 8 && m >= 6 ? 'sommer' : m >= 9 && m <= 11 ? 'herbst' : 'winter';
  }
  const seasonName = { fruehling: 'Frühling', sommer: 'Sommer', herbst: 'Herbst', winter: 'Winter' };
  // {name} und {buddy} in Texten ersetzen
  function t(s, extra) {
    const st = window.Store ? Store.state : {};
    let out = String(s).replace(/\{name\}/g, st.name || 'Reporterin').replace(/\{buddy\}/g, st.buddy || 'Capy');
    if (extra) for (const k in extra) out = out.replace(new RegExp('\\{' + k + '\\}', 'g'), extra[k]);
    return out;
  }
  // Glitzer-Effekt an einer Stelle (oder Bildschirmmitte)
  function sparkle(x, y, n = 16) {
    if (document.body.classList.contains('calm')) return;
    const box = document.getElementById('glitter');
    if (x == null) { x = innerWidth / 2; y = innerHeight / 2.4; }
    const sym = ['✨', '⭐', '💜', '💙', '🌟', '✦'];
    for (let i = 0; i < n; i++) {
      const s = h('span.spark', { text: pick(sym) });
      const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 140;
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      box.appendChild(s);
      setTimeout(() => s.remove(), 1300);
    }
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // Zahlwort für die Vorlesefunktion (deutsche Sprechweise, bis 100)
  function zahlwort(n) {
    const e = ['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
    const z = ['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
    if (n < 20) return e[n];
    if (n === 100) return 'hundert';
    const t1 = Math.floor(n / 10), o = n % 10;
    return o === 0 ? z[t1] : (o === 1 ? 'ein' : e[o]) + 'und' + z[t1];
  }
  return { h, rnd, pick, shuffle, uniq, today, dateDE, season, seasonName, t, sparkle, wait, zahlwort };
})();

/* Speicher: alles bleibt im localStorage dieses Geräts.
   Funktioniert auch, wenn der Speicher gesperrt ist (dann nur bis zum Neuladen). */
window.Store = (function () {
  const KEY = 'capy-mathe-v1';
  const fresh = () => ({
    version: 1,
    name: '', buddy: 'Capy', created: U.today(),
    settings: { sound: true, speech: true, calm: false },
    introSeen: false, startcheckDone: false, recommended: 'w1',
    skills: {},          // je Übungstyp: Stufe, Versuche, Fehlertypen, Tage
    sessions: [],        // Verlauf der Einheiten
    stars: 0, coins: 0,  // Mutmach-Sterne, Capy-Geld
    items: [], room: {}, // Gegenstände und Positionen im Zimmer
    chapters: { w1: 0, w2: 0, w3: 0 },
    gems: [],            // gemeisterte Übungstypen (Stärken-Schatzkiste)
    reflections: [],
    unlocked: [],        // freigeschaltete Sonder-PDFs
    lastVisit: null, letterWeek: null
  });
  let state = fresh();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(fresh(), JSON.parse(raw));
  } catch (e) { /* Speicher nicht verfügbar: mit frischem Zustand weiter */ }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignorieren */ }
    if (window.App) App.refreshCounters();
  }
  function skill(id) {
    if (!state.skills[id]) state.skills[id] = { level: 1, tries: 0, first: 0, solved: 0, errors: {}, days: {}, streak: 0, lastSeen: null, goodDays: [] };
    return state.skills[id];
  }
  function reset() { state = fresh(); save(); location.reload(); }
  function exportData() { return JSON.stringify(state, null, 2); }
  function importData(txt) {
    const d = JSON.parse(txt);
    if (!d || typeof d !== 'object' || !('skills' in d)) throw new Error('Keine gültige Sicherungsdatei.');
    state = Object.assign(fresh(), d); save();
  }
  return { get state() { return state; }, save, skill, reset, exportData, importData };
})();

/* ===== js/core/sound.js ===== */
/* Töne (selbst erzeugt, keine Audiodateien) und Capys Stimme.
   Die Stimme nutzt die Sprachausgabe des Geräts (Web Speech API).
   Capy wählt automatisch die natürlichste deutsche Stimme, die auf dem Gerät installiert ist,
   spricht Satz für Satz mit eigener Sprechmelodie und kann im Eltern-Bereich angepasst werden. */
window.Sound = (function () {
  let ctx = null;
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type = 'sine', vol = .18) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + start);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + start + .02);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + .05);
  }
  const on = () => Store.state.settings.sound;
  function play(kind) {
    if (!on()) return;
    if (kind === 'ok') { tone(660, 0, .15); tone(880, .1, .25); }
    else if (kind === 'oops') { tone(392, 0, .18, 'triangle', .12); tone(330, .12, .22, 'triangle', .1); }
    else if (kind === 'tap') tone(520, 0, .07, 'triangle', .08);
    else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3));
    else if (kind === 'coin') { tone(988, 0, .08, 'square', .06); tone(1319, .07, .18, 'square', .06); }
  }

  /* ---------- Stimmen finden und bewerten ---------- */
  const hasTTS = 'speechSynthesis' in window;
  // Voreinstellungen. "kind" hebt die Tonlage an, damit Capy jünger klingt, ohne quietschig zu werden.
  const PRESETS = {
    kind: { label: 'Kinderstimme (Capy)', pitch: 1.65, rate: 1.12 },
    natur: { label: 'Ganz natürlich', pitch: 1.05, rate: 1.0 },
    langsam: { label: 'Langsam und deutlich', pitch: 1.5, rate: .9 }
  };
  const FEMALE = /anna|petra|helena|marlene|vicki|katja|hedda|amala|seraphina|louisa|elke|ingrid|maja|gisela|tanja|conchita|female|frau|weiblich/i;
  const MALE = /markus|yannick|stefan|conrad|killian|hans|florian|jonas|ralf|male|mann|männlich/i;

  // Je höher, desto natürlicher klingt die Stimme meistens
  function score(v) {
    let s = 0;
    if (/^de[-_]DE/i.test(v.lang)) s += 6; else if (/^de/i.test(v.lang)) s += 3;
    if (/premium/i.test(v.name)) s += 50;
    if (/enhanced|erweitert|verbessert/i.test(v.name)) s += 40;
    if (/natural|neural/i.test(v.name)) s += 45;
    if (/siri/i.test(v.name)) s += 30;
    if (/google/i.test(v.name)) s += 15;
    if (FEMALE.test(v.name)) s += 10;      // hellere Grundstimme klingt mit Anhebung kindlicher
    if (MALE.test(v.name)) s -= 8;
    if (/compact|espeak/i.test(v.name)) s -= 30;
    if (!v.localService) s -= 25;           // Online-Stimmen senden Text an den Anbieter, daher nur bewusst wählen
    return s;
  }
  function germanVoices() {
    if (!hasTTS) return [];
    return speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang)).sort((a, b) => score(b) - score(a));
  }
  function quality(v) {
    if (/premium|natural|neural|siri/i.test(v.name)) return 'sehr natürlich';
    if (/enhanced|erweitert|verbessert/i.test(v.name)) return 'natürlich';
    if (/google/i.test(v.name)) return 'gut';
    return 'Standard';
  }
  let voice = null;
  function pickVoice() {
    const vs = germanVoices();
    const want = Store.state.settings.voiceURI;
    voice = (want && vs.find(v => v.voiceURI === want)) || vs[0] || null;
  }
  if (hasTTS) { pickVoice(); speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', pickVoice) : (speechSynthesis.onvoiceschanged = pickVoice); }

  /* ---------- Text sprechfreundlich machen ---------- */
  function prepare(text) {
    const buddy = Store.state.buddy || 'Capy';
    let t = String(text)
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '')   // Emojis
      .replace(/(\d{1,2}):(\d{2})/g, (m, h, mi) => mi === '00' ? `${Number(h)} Uhr` : `${Number(h)} Uhr ${Number(mi)}`)
      .replace(/(\d+) € (\d+) ct/g, '$1 Euro und $2 Cent')
      .replace(/(\d+)\s?€/g, '$1 Euro').replace(/(\d+)\s?ct\b/g, '$1 Cent').replace(/€/g, 'Euro')
      .replace(/(\d) : (\d)/g, '$1 geteilt durch $2')
      .replace(/=\s*[_?]\s*$/g, ' ist wie viel?').replace(/=\s*[_?]\s+/g, ' ist wie viel? ').replace(/×/g, ' mal ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ').replace(/ = /g, ' ist ')
      .replace(/ist\s*\?/g, 'ist wie viel?').replace(/_/g, ' wie viel ')
      .replace(/(\d+) cm\b/g, '$1 Zentimeter').replace(/\bz\. ?B\./g, 'zum Beispiel')
      .replace(/„|“|"|»|«/g, '').replace(/\s*–\s*/g, ', ').replace(/…/g, '.')
      .replace(/\s{2,}/g, ' ').trim();
    // Aussprache von Capybara und Capy (sonst oft „Zappi“ oder englisch)
    t = t.replace(/Capybaras/g, 'Kapibaras').replace(/Capybara/g, 'Kapibara');
    if (/^capy$/i.test(buddy)) t = t.replace(/\bCapys\b/g, 'Käppis').replace(/\bCapy\b/g, 'Käppi');
    return t;
  }
  // In Sätze teilen, damit jeder Satz seine eigene Melodie bekommt
  function sentences(t) {
    return (t.match(/[^.!?]+[.!?]*/g) || [t]).map(s => s.trim()).filter(s => s.length > 1);
  }

  /* ---------- Sprechen ---------- */
  let queueId = 0;
  function speak(text, force) {
    if (!hasTTS) return;
    if (!force && !(Store.state.settings.speech && on())) return;
    try {
      speechSynthesis.cancel();
      if (!voice) pickVoice();
      const set = Store.state.settings;
      // Alte Kinderstimme (Version 1) automatisch auf die neue, niedlichere Einstellung heben
      if (set.pitch === 1.4 && set.rate === 1.0) { set.pitch = PRESETS.kind.pitch; set.rate = PRESETS.kind.rate; Store.save(); }
      const basePitch = set.pitch != null ? set.pitch : PRESETS.kind.pitch;
      const baseRate = set.rate != null ? set.rate : PRESETS.kind.rate;
      const parts = sentences(prepare(text));
      const id = ++queueId;
      parts.forEach((s, i) => {
        const u = new SpeechSynthesisUtterance(s);
        u.lang = voice ? voice.lang : 'de-DE';
        if (voice) u.voice = voice;
        // Sprechmelodie wie ein Kind: Fragen etwas höher, Ausrufe lebhafter, letzter Satz ruhiger
        let p = basePitch, r = baseRate;
        if (/\?$/.test(s)) p += .08;
        if (/!$/.test(s)) { p += .05; r += .04; }
        if (i === parts.length - 1 && parts.length > 1 && !/[!?]$/.test(s)) p -= .04;
        if (s.split(' ').length <= 3) r -= .03;      // kurze Ausrufe nicht hetzen
        u.pitch = Math.max(.5, Math.min(2, p));
        u.rate = Math.max(.6, Math.min(1.4, r));
        u.volume = 1;
        u.onerror = () => {};
        if (id === queueId) speechSynthesis.speak(u);
      });
    } catch (e) { /* Sprachausgabe nicht verfügbar */ }
  }
  function stop() { try { queueId++; speechSynthesis.cancel(); } catch (e) {} }

  return { play, speak, stop, unlock: ac, germanVoices, quality, pickVoice, PRESETS, get voice() { return voice; }, hasTTS };
})();

/* Capy, der Capybara-Lernbuddy: eigene SVG-Figur mit Gesichtsausdrücken

window.Capy = (function () {
  function svg(opt = {}) {
    const mood = opt.mood || 'happy';

      mouth = `<path d="M88 118 q12 12 24 0" fill="none" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`;
    }
    const hat = opt.hat ? `<g transform="translate(86 6)"><circle cx="14" cy="22" r="16" fill="${line ? '#fff' : '#ff9a2e'}" ${line ? st : ''}/><path d="M14 6 q6 -10 14 -6 q-6 6 -14 6" fill="${line ? '#fff' : '#4fae74'}" ${line ? st : ''}/></g>` : '';
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <ellipse cx="100" cy="98" rx="20" ry="11" fill="${dark}" ${st}/>
      <ellipse cx="93" cy="98" rx="3" ry="4" fill="${line ? '#222' : '#2b1a10'}"/><ellipse cx="107" cy="98" rx="3" ry="4" fill="${line ? '#222' : '#2b1a10'}"/>
      ${eyes}${mouth}${cheek}${hat}${extra}
    </svg>`;
  }

  let timer = null, lastText = '';
  function say(text, mood = 'happy', opts = {}) {
    const msg = U.t(text);
    lastText = msg;

    if (!opts.silent) Sound.speak(msg);
    clearTimeout(timer);
    if (!opts.stay) timer = setTimeout(() => (b.hidden = true), opts.ms || Math.max(4500, msg.length * 85));

  function setMood(mood) {
    document.getElementById('buddyCapy').innerHTML = svg({ mood, hat: Store.state.items.includes('mandarine') });

  const phrase = (key, extra) => U.t(U.pick(PHRASES[key]), extra);
  return { svg, say, setMood, bounce, hide, repeat, phrase };
})();

/* Mathe-Material als Bausteine: Zwanzigerfeld, Gruppen, Spielgeld, Uhr,
   Rechenstrich, Zehnerstangen, Punktefelder. */
window.V = (function () {
  const { h } = U;

  /* Zwanzigerfeld: a rote, b blaue Plättchen, Reihe 1 zuerst (Kraft der Fünf und Zehn).
     opts.cross: so viele Plättchen am Ende durchstreichen (Minus).
     opts.tap: leere Felder antippbar (füllen mit Farbe opts.tapColor). Rückgabe hat .count() */
  function field20(a, b = 0, opts = {}) {
    const rows = opts.rows || 2;
    const wrap = h('div.field20');
    const cells = [];
    let added = 0;
    for (let r = 0; r < rows; r++) {
      const row = h('div.frow');
      for (let c = 0; c < 10; c++) {
        if (c === 5) row.appendChild(h('span'));
        const i = r * 10 + c;
        const cell = h('div.cell');
        let kind = i < a ? 'r' : i < a + b ? 'b' : null;
        if (opts.cross && i >= a + b - opts.cross && i < a + b) kind = 'x';
        if (kind) cell.appendChild(h('div.dot.' + kind));
        else if (opts.tap) {
          cell.classList.add('tap');
          cell.addEventListener('pointerdown', () => {
            const has = cell.firstChild;
            if (has) { cell.innerHTML = ''; added--; } else { cell.appendChild(h('div.dot.' + (opts.tapColor || 'b'))); added++; }
            Sound.play('tap');
            opts.onChange && opts.onChange(added);
          });
        }
        cells.push(cell); row.appendChild(cell);
      }
      wrap.appendChild(row);
    }

  function groups(emo, nums) {

  /* Spielgeld (bewusst stilisiert, mit Aufdruck SPIELGELD) */
  const MONEY = {
    1: { kind: 'c', label: '1 €', col: '#e3c25a', ring: '#c9cbd2', size: 64 },
    2: { kind: 'c', label: '2 €', col: '#c9cbd2', ring: '#e3c25a', size: 72 },

  };
  function moneySVG(v) {
    const m = MONEY[v];
    if (m.kind === 'c') {
      const s = m.size;
      return `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="${m.ring}" stroke="#8a7a3a" stroke-width="2"/><circle cx="32" cy="32" r="22" fill="${m.col}"/><text x="32" y="37" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="bold" font-size="${m.label.length > 3 ? 13 : 16}" fill="#3a2f10">${m.label}</text><text x="32" y="50" text-anchor="middle" font-size="5.5" font-family="Arial, sans-serif" fill="#3a2f10">SPIELGELD</text></svg>`;
    }

  }

  /* Analoge Uhr. opts.hlHour/hlMin heben Zeiger hervor, opts.hideHands */
  function clockSVG(hh, mm, opts = {}) {
    const ha = ((hh % 12) + mm / 60) * 30, ma = mm * 6;
    let ticks = '', nums = '';
    for (let i = 0; i < 60; i++) {
      const a = i * 6 * Math.PI / 180, r1 = i % 5 ? 88 : 82;
      ticks += `<line x1="${100 + Math.sin(a) * r1}" y1="${100 - Math.cos(a) * r1}" x2="${100 + Math.sin(a) * 92}" y2="${100 - Math.cos(a) * 92}" stroke="#7a7398" stroke-width="${i % 5 ? 1.5 : 3}"/>`;
    }
    for (let i = 1; i <= 12; i++) {
      const a = i * 30 * Math.PI / 180;
      nums += `<text x="${100 + Math.sin(a) * 68}" y="${100 - Math.cos(a) * 68 + 7}" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2b2550">${i}</text>`;
    }
    const hand = (ang, len, w, col, cls) => `<line class="${cls}" x1="100" y1="100" x2="${100 + Math.sin(ang * Math.PI / 180) * len}" y2="${100 - Math.cos(ang * Math.PI / 180) * len}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
    const hCol = opts.hlHour ? '#ef5b6b' : '#2b2550', mCol = opts.hlMin ? '#3f8fe0' : '#5b3a99';
    return `<svg class="clock-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="96" fill="#fff" stroke="#9a72dd" stroke-width="6"/>${ticks}${nums}
      ${opts.hideHands ? '' : hand(ha, 46, 9, hCol, 'h-hand') + hand(ma, 74, 6, mCol, 'm-hand')}
      <circle cx="100" cy="100" r="7" fill="#ffc94d" stroke="#2b2550" stroke-width="2"/></svg>`;
  }

  /* Rechenstrich: start, Sprünge [+3, +2] → Bögen mit Zwischenergebnissen */
  function strich(start, jumps) {
    const pts = [start]; jumps.forEach(j => pts.push(pts[pts.length - 1] + j));
    const min = Math.min(...pts), max = Math.max(...pts), span = Math.max(1, max - min);
    const W = 600, x = v => 40 + (v - min) / span * (W - 80);
    let s = `<svg viewBox="0 0 ${W} 150" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="110" x2="${W - 20}" y2="110" stroke="#2b2550" stroke-width="4" stroke-linecap="round"/>`;
    pts.forEach((p, i) => { s += `<line x1="${x(p)}" y1="100" x2="${x(p)}" y2="120" stroke="#2b2550" stroke-width="3"/><text x="${x(p)}" y="144" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="22" font-weight="bold" fill="${i === pts.length - 1 ? '#9a72dd' : '#1d5f96'}">${p}</text>`; });
    jumps.forEach((j, i) => {
      const a = x(pts[i]), b = x(pts[i + 1]), mid = (a + b) / 2, top = 110 - Math.min(80, 30 + Math.abs(b - a) / 3);
      s += `<path d="M${a} 104 Q${mid} ${top} ${b} 104" fill="none" stroke="${j > 0 ? '#3f9fe0' : '#ef5b6b'}" stroke-width="4"/><text x="${mid}" y="${top + 26}" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="20" font-weight="bold" fill="${j > 0 ? '#1d5f96' : '#a3303f'}">${j > 0 ? '+' + j : '−' + Math.abs(j)}</text>`;
    });
    return h('div.rstrich', { html: s + '</svg>' });
  }

  /* Zehnerstangen und Einerwürfel */
  function tensOnes(t, o, opts = {}) {
    const box = h('div.place');
    const tens = h('div.tens'); for (let i = 0; i < t; i++) { const b = h('div.ten-bar'); for (let k = 0; k < 10; k++) b.appendChild(h('i')); if (opts.onTen) b.addEventListener('pointerdown', () => opts.onTen(i)); tens.appendChild(b); }
    const ones = h('div.ones'); for (let i = 0; i < o; i++) { const c = h('div.one'); if (opts.onOne) c.addEventListener('pointerdown', () => opts.onOne(i)); ones.appendChild(c); }
    box.append(tens, ones);
    return box;
  }
  function zeTafel(z, e) {
    return h('div.zetafel', {}, [h('div.h', { text: 'Zehner' }), h('div.h', { text: 'Einer' }), h('div', { text: z }), h('div', { text: e })]);
  }

  /* Punktefeld fürs Einmaleins: rows Reihen mit je cols Dingen */
  function array(rows, cols, emo, hlRows = 0) {
    const a = h('div.array');
    for (let r = 0; r < rows; r++) {
      const row = h('div.arow' + (r < hlRows ? '.hl' : ''));
      for (let c = 0; c < cols; c++) row.appendChild(h('span', { text: emo }));
      a.appendChild(row);
    }
    return a;
  }

  /* Schmetterling: links n Punkte, rechts gespiegelt (oder leer zum Verdoppeln) */
  function butterfly(left, right) {
    const wing = (n, side, ghost) => { const w = h('div.wing.' + side); for (let i = 0; i < 10; i++) w.appendChild(i < n ? h('div.dot.' + (ghost ? 'ghost' : side === 'l' ? 'r' : 'b')) : h('span')); return w; };
    return h('div.wing-wrap', {}, [wing(left, 'l'), h('div.body-bar'), wing(right, 'r')]);
  }

  return { field20, groups, MONEY, moneySVG, clockSVG, strich, tensOnes, zeTafel, array, butterfly };
})();

/* ===== js/core/pdf.js ===== */
/* Eigener kleiner PDF-Erzeuger ohne fremde Bibliothek:
   Jede Seite wird auf ein Canvas gemalt und als Bild in eine A4-PDF gelegt.
   Alles passiert im Browser, nichts wird verschickt. */
window.PDF = (function () {
  const W = 1240, H = 1754; // A4 bei 150 dpi
  const FONT = '"Arial Rounded MT Bold", "Avenir Next Rounded", "Nunito", Arial, sans-serif';

  async function build(pageFns) {
    const enc = new TextEncoder();
    const chunks = []; let len = 0; const offs = [];
    const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };
    const imgs = [];
    for (const fn of pageFns) {
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      await fn(ctx);
      const b64 = c.toDataURL('image/jpeg', 0.9).split(',')[1];
      const bin = atob(b64); const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      imgs.push(arr);
    }
    const n = imgs.length;
    // Objektnummern: 1 Katalog, 2 Seitenbaum, dann je Seite 3 Objekte
    const pageId = i => 3 + i * 3, contId = i => 4 + i * 3, imgId = i => 5 + i * 3;
    const total = 2 + n * 3;
    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const obj = (id, body) => { offs[id] = len; push(id + ' 0 obj\n'); push(body); push('\nendobj\n'); };
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Count ${n} /Kids [${imgs.map((_, i) => pageId(i) + ' 0 R').join(' ')}] >>`);
    imgs.forEach((img, i) => {
      obj(pageId(i), `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${imgId(i)} 0 R >> >> /Contents ${contId(i)} 0 R >>`);
      const cs = `q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
      obj(contId(i), `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
      offs[imgId(i)] = len;
      push(`${imgId(i)} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);
      push(img); push('\nendstream\nendobj\n');
    });
    const xref = len;
    let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
    for (let i = 1; i <= total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    push(x + `trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  /* ---------- Zeichenhilfen ---------- */
  function txt(ctx, s, x, y, size = 40, opt = {}) {
    ctx.font = `${opt.bold === false ? '' : 'bold '}${size}px ${FONT}`;
    ctx.fillStyle = opt.color || '#2b2550'; ctx.textAlign = opt.align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(s, x, y);
  }
  // Text mit Zeilenumbruch, gibt neue y-Position zurück
  function para(ctx, s, x, y, maxW, size = 34, opt = {}) {
    ctx.font = `${opt.bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.fillStyle = opt.color || '#2b2550'; ctx.textAlign = 'left';
    const words = String(s).split(' '); let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += size * 1.4; line = w; } else line = test;
    }
    if (line) { ctx.fillText(line, x, y); y += size * 1.4; }
    return y;
  }
  function rrect(ctx, x, y, w, h, r, fill, stroke, lw = 4) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function svgImg(svg, x, y, w, h, ctx) {
    return new Promise(res => {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, x, y, w, h); res(); };
      img.onerror = () => res();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.includes('xmlns') ? svg : svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"'));
    });
  }
  function frame(ctx, col = '#9a72dd') {
    rrect(ctx, 40, 40, W - 80, H - 80, 50, null, col, 10);
    ctx.font = `50px ${FONT}`;
    ['✨', '🌿', '⭐', '🦋'].forEach((e, i) => ctx.fillText(e, [70, W - 130, 70, W - 130][i], [120, 120, H - 70, H - 70][i]));
  }
  function footer(ctx) { txt(ctx, 'Capys Mathe-Regenwald · ' + U.dateDE(), W / 2, H - 70, 24, { align: 'center', bold: false, color: '#8a84a8' }); }
  const name = () => Store.state.name || 'Reporterin';

      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(160 + i * 185, 1470, 34, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(160 + i * 185, 1504); ctx.lineTo(160 + i * 185, 1560); ctx.stroke(); }
      ctx.globalAlpha = .35; ctx.font = `70px ${FONT}`; deco.forEach((d, i) => ctx.fillText(d, 140 + i * 400, 1650)); ctx.globalAlpha = 1;
      para(ctx, 'Mathe-Extra: Male 5 Blätter grün und 5 Blätter gelb. Wie viele sind es zusammen?', 120, 1240, W - 240, 30);

/* Gemeinsame Bausteine für alle Übungstypen.
   Jeder Übungstyp wird mit X.reg({...}) angemeldet und hat eine Funktion gen(stufe),
   die eine Aufgabe erzeugt:
   { q, say, eq, render(stage), input: 'numpad'|'choice'|'widget', choices, label(v),
     answer, check(v), hint, help(box), steps[], analyze(v), strat } */
window.SKILLS = [];
window.X = (function () {
  const { h, rnd, pick, shuffle } = U;
  function reg(s) { SKILLS.push(s); }
  const byId = id => SKILLS.find(s => s.id === id);

  // Fehlerarten mit Erklärung für Eltern und passender Trainingsmission
  const ERR = {
    zaehlt: { text: 'Um 1 daneben: zählt vermutlich noch einzeln', train: ['blitz', 'freunde'], mission: 'Die Frösche wollen in Fünfergruppen sitzen.' },
    fuenf: { text: 'Um 5 daneben: Fünferstruktur noch unsicher', train: ['blitz'], mission: 'Die Fünferbande hat sich versteckt.' },
    zehner: { text: 'Fehler beim Zehnerübergang (Auffüllen bis 10)', train: ['freunde', 'plus20'], mission: 'Die Tukane brauchen genau 10 Plätze im Nest.' },
    operation: { text: 'Plus und Minus verwechselt', train: [], mission: 'Die Papageien haben die Rechenzeichen vertauscht.' },
    dreher: { text: 'Zahlendreher (Zehner und Einer vertauscht)', train: ['buendeln', 'hunderter'], mission: 'Papagei Piet dreht wieder die Zahlen um.' },
    uebertrag: { text: 'Um 10 daneben: Zehner beim Übergang vergessen oder doppelt', train: ['ergaenzen', 'analogie'], mission: 'Auf der Brücke fehlen ein paar Bretter bis zum nächsten Zehner.' },
    stelle: { text: 'Zehner- und Einerstelle verwechselt', train: ['buendeln', 'hunderter'], mission: 'Der Biber hat seine Stöckchen durcheinandergebracht.' },
    zeiger: { text: 'Stunden- und Minutenzeiger vertauscht', train: ['uhr1'], mission: 'Papagei Piet kommt wieder zu spät.' },
    halb: { text: '„halb“ falsch gedeutet (halb 4 = 3:30)', train: ['uhr1'], mission: 'Die Turmuhr zeigt halb, und keiner weiß, was das heißt.' },
    viertel: { text: '„Viertel nach“ und „Viertel vor“ verwechselt', train: ['uhr2'], mission: 'Eule Ella verwechselt Viertel nach und Viertel vor.' },
    geld: { text: 'Betrag beim Bezahlen nicht passend', train: ['geld20'], mission: 'Momo am Kiosk braucht Hilfe beim Kassieren.' },
    muenzen: { text: 'Nicht mit möglichst wenigen Münzen bezahlt', train: ['geld20'], mission: 'Im Kiosk-Geldbeutel ist nur wenig Platz.' },
    cent: { text: 'Euro und Cent verwechselt', train: ['geld100'], mission: 'Das Gürteltier am Markt verwechselt Euro und Cent.' },
    reihe: { text: 'Einmaleins: eine Reihe daneben', train: ['mal'], mission: 'Die Capybara-Familien wollen gezählt werden.' },
    sonst: { text: 'Anderer Fehler', train: [], mission: 'Im Regenwald gibt es ein kniffliges Rätsel.' }
  };

  // Zahl-Ergebnis analysieren
  function analyzeNum(v, ans, o = {}) {
    v = Number(v);
    if (v === ans) return null;
    if (o.other != null && v === o.other) return 'operation';
    if (ans >= 10 && v >= 10 && ans < 100 && v < 100 && String(v) === String(ans).split('').reverse().join('')) return 'dreher';
    if (Math.abs(v - ans) === 1) return 'zaehlt';
    if (Math.abs(v - ans) === 10) return o.crossing ? 'uebertrag' : 'stelle';
    if (Math.abs(v - ans) === 5 && o.five) return 'fuenf';
    if (o.crossing) return 'zehner';
    return 'sonst';
  }
  // Ablenker für Auswahlantworten
  function distract(ans, cands, n = 3, min = 0, max = 100) {
    const set = new Set([ans]);
    cands.forEach(c => { if (set.size < n && c >= min && c <= max && c !== ans) set.add(c); });
    while (set.size < n) { const c = ans + rnd(-4, 4); if (c >= min && c <= max) set.add(c); }
    return shuffle([...set]);
  }
  const ANIMALS = [
    { e: '🐸', p: 'Frösche', s: 'sitzen am Fluss', d: 'hüpfen dazu', w: 'hüpfen weg' },
    { e: '🦜', p: 'Papageien', s: 'sitzen im Baum', d: 'fliegen dazu', w: 'fliegen weg' },
    { e: '🐒', p: 'Äffchen', s: 'schaukeln an Lianen', d: 'kommen dazu', w: 'klettern weg' },
    { e: '🦋', p: 'Schmetterlinge', s: 'sitzen auf Blüten', d: 'flattern dazu', w: 'flattern weg' },
    { e: '🐢', p: 'Schildkröten', s: 'sonnen sich', d: 'krabbeln dazu', w: 'krabbeln weg' },
    { e: '🍊', p: 'Mandarinen', s: 'liegen im Korb', d: 'kommen dazu', w: 'isst Capy auf' },
    { e: '🐞', p: 'Marienkäfer', s: 'krabbeln auf dem Blatt', d: 'krabbeln dazu', w: 'fliegen weg' }
  ];
  const animal = () => pick(ANIMALS);
  const helpText = (box, s) => box.appendChild(h('p', { style: 'font-family:var(--font);font-size:1.15rem', text: s }));

  return { reg, byId, ERR, analyzeNum, distract, animal, helpText, ANIMALS };
})();

(function () {

        analyze: v => analyzeNum(v, n, { five: true })

  /* 2) Zehnerfreunde: auffüllen bis 10 */
  reg({

        const e = rnd(2, 9); return { q: 'Wie viele Euro sind das?', eq: `${e * 100} ct = _ €`, say: `${e * 100} Cent sind wie viele Euro?`, input: 'numpad', answer: e, hint: 'Tipp: 100 Cent sind 1 Euro.', help(box) { helpText(box, '100 ct = 1 €'); }, steps: ['100 ct = 1 €', `${e * 100} ct = ${e} €`], analyze: v => Number(v) === e * 100 || Number(v) === e * 10 ? 'cent' : 'sonst' };
      }
      let price, paid;

      else { paid = pick([50, 100]); price = rnd(paid === 50 ? 21 : 41, paid - 3); if (price % 10 === 0) price += 3; }
      const ch = paid - price, up = Math.ceil(price / 10) * 10, jumps = up === paid || price % 10 === 0 ? [ch] : [up - price, paid - up];
      return {
        q: `Die ${g[1]} kostet ${price} €. Du bezahlst mit ${paid} €. Wie viel Rückgeld bekommst du?`, say: `Die ${g[1]} kostet ${price} Euro. Du bezahlst mit ${paid} Euro. Wie viel Rückgeld bekommst du?`,
        render: stage => stage.append(h('div.price-tag', {}, [h('span.emo', { text: g[0] }), `${price} €`]), h('div', { html: V.moneySVG(paid) })),
        eq: `${price} € + _ € = ${paid} €`, input: 'numpad', answer: ch,

        analyze: v => Number(v) === paid + price ? 'operation' : analyzeNum(v, ch, { crossing: true })
      };
    }
  });

  /* 16) Uhr: Viertel, Minuten, Uhr stellen, Zeitspannen */
  const fmt = (hh, mm) => `${hh}:${String(mm).padStart(2, '0')}`;
  reg({
    id: 'uhr2', world: 'w3', emo: '🕰️', title: 'Turmuhr', strat: 'uhr', gem: 'Minuten-Meisterin',
    desc: 'Viertelstunden, Minuten, Zeitspannen', komp: 'Größen und Messen: Uhrzeiten auf die Minute, Viertelstunden, Zeitspannen bestimmen',

          steps: [`Langer Zeiger auf ${after ? 3 : 9}`, ans], analyze: v => v === wrong ? 'viertel' : 'zeiger'

          steps: [`Langer Zeiger auf ${mm / 5}`, `${mm / 5} × 5 = ${mm} Minuten`, `Es ist ${fmt(hh, mm)}`],

            const holder = h('div', { html: V.clockSVG(hh, 0) }); stage.appendChild(holder);
            const readout = h('p.sum-line', { text: fmt(hh, 0) }); stage.appendChild(readout);
            svgEl = holder.querySelector('svg');
            const set = m => {

              hHand.setAttribute('x2', 100 + Math.sin(ha * Math.PI / 180) * 46); hHand.setAttribute('y2', 100 - Math.cos(ha * Math.PI / 180) * 46);
              mHand.setAttribute('x2', 100 + Math.sin(m * 6 * Math.PI / 180) * 74); mHand.setAttribute('y2', 100 - Math.cos(m * 6 * Math.PI / 180) * 74);
              readout.textContent = fmt(hh, m);
            };
            let drag = false;
            const move = e => {
              const r = svgEl.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
              let ang = Math.atan2(x, -y) * 180 / Math.PI; if (ang < 0) ang += 360;
              const m = Math.round(ang / 30) * 5 % 60;
              if (m !== cur) { set(m); Sound.play('tap'); }
            };
            svgEl.addEventListener('pointerdown', e => { drag = true; svgEl.setPointerCapture(e.pointerId); move(e); });
            svgEl.addEventListener('pointermove', e => drag && move(e));
            svgEl.addEventListener('pointerup', () => (drag = false));
            return { getValue: () => cur };
          },
          input: 'widget', answer: mm,
          hint: `Tipp: ${mm} Minuten. In 5er-Schritten: auf welche Zahl muss der lange Zeiger?`,
          help(box) { box.insertAdjacentHTML('beforeend', V.clockSVG(hh, mm, { hlMin: true })); helpText(box, `${mm} : 5 = ${mm / 5}. Der lange Zeiger muss auf die ${mm / 5}.`); },
          steps: [`${mm} Minuten`, `${mm} = ${mm / 5} × 5`, `Langer Zeiger auf ${mm / 5}`],
          analyze: v => v === (hh % 12) * 5 ? 'zeiger' : 'sonst'
        };
      }
      const sm = pick([0, 15, 30, 45]), dur = pick([10, 15, 20, 30, 45]);
      const end = sm + dur, eh = hh + Math.floor(end / 60), em = end % 60;
      const ans = fmt(eh, em);
      const opts = U.uniq([ans, fmt(hh, (sm + dur + 10) % 60), fmt(eh + 1, em), fmt(hh, Math.abs(sm - dur) % 60)]).slice(0, 3);
      const an = pick(['Die Reportage', 'Das Froschkonzert', 'Die Bootsfahrt', 'Der Ausflug']);
      return {

        render: stage => stage.insertAdjacentHTML('beforeend', V.clockSVG(hh, sm)),
        input: 'choice', text: true, choices: shuffle(opts), answer: ans,
        hint: 'Tipp: Gehe in Minuten-Schritten weiter. Nach 60 Minuten beginnt eine neue Stunde.',
        help(box) { box.insertAdjacentHTML('beforeend', V.clockSVG(eh, em, { hlMin: true })); helpText(box, `Von ${fmt(hh, sm)} plus ${dur} Minuten.`); },
        steps: [`Start: ${fmt(hh, sm)}`, `+ ${dur} Minuten`, `Ende: ${ans}`], analyze: () => 'sonst'

  });
